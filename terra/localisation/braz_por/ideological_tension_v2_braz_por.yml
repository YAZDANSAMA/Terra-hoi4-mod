 ideological_tension_v2.1.t:0 "Ideological Tensions with [potential_target.GetNameDef]"
 ideological_tension_v2.1.d:0 "[event_receiver.GetNameDef] faces ideological tensions with neighbor [potential_target.GetNameDef]. Intelligence reports suggest that if conflict were to break out, our faction would control approximately [?our_faction_strength|0] strength compared to their [?target_faction_strength|0]. Should we take action against them?"
 ideological_tension_v2.1.a:0 "We must challenge them"
 ideological_tension_v2.1.b:0 "We have more pressing concerns"
 
 ideological_tension_v2.2.t:0 "Opportunity Against [weak_target.GetNameDef]"
 ideological_tension_v2.2.d:0 "Intelligence reports indicate that [weak_target.GetNameDef] is significantly weaker than our coalition. Our combined forces control [?our_faction_strength|0] strength while they can only muster [?target_faction_strength|0]. This presents a golden opportunity to eliminate this ideological threat."
 ideological_tension_v2.2.a:0 "Strike now while we have the advantage!"
 ideological_tension_v2.2.b:0 "We should not act rashly"
 
 ideological_tension_v2.3.t:0 "Confronting [great_power_target.GetNameDef]"
 ideological_tension_v2.3.d:0 "The great power of [great_power_target.GetNameDef] stands as an obstacle to our ambitions. Our faction commands approximately [?our_faction_strength|0] strength while theirs controls around [?target_faction_strength|0]. The balance of power will determine whether we should act now or wait."
 ideological_tension_v2.3.a:0 "We will not be intimidated by them"
 ideological_tension_v2.3.b:0 "We should focus on consolidating our power"
 
 ideological_tension_v2.4.t:0 "The War Involving [intervention_target.GetNameDef]"
 ideological_tension_v2.4.d:0 "[intervention_target.GetNameDef] is currently engaged in a major war. Our democratic faction controls approximately [?our_faction_strength|0] strength while their totalitarian coalition has around [?target_faction_strength|0]. Many in our government believe we have a moral obligation to intervene."
 ideological_tension_v2.4.a:0 "We must stand against tyranny"
 ideological_tension_v2.4.b:0 "This is not our war to fight"
 
 ideological_tension_v2.5.t:0 "The Crisis Involving [intervention_target.GetNameDef]"
 ideological_tension_v2.5.d:0 "[intervention_target.GetNameDef] is embroiled in a great power conflict. Our faction commands approximately [?our_faction_strength|0] strength while their coalition controls around [?target_faction_strength|0]. While we have traditionally maintained our neutrality, some voices in our government suggest that the scale of this conflict threatens our own interests. Should we break with tradition and intervene?"
 ideological_tension_v2.5.a:0 "Our interests are at stake"
 ideological_tension_v2.5.b:0 "We must preserve our neutrality"
