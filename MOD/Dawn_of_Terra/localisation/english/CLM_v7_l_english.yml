l_english:
 CLM_victoria_pact:0 "Hail, Victoria"
 CLM_v7.1.t:0 "A bright spark"
 CLM_v7.1.d:0 "\"Come on, darling. There's no reason to be worried. The Vice President won't bite you.\"\n\nYou watch as a young Lupo Woman steps forward from behind the Professor.\n\n\"Uhm... h-hello. I am N-Nataly. M-Mister President,\" she says as she takes a hasty bow before continuing: \"a-and Vice President. I-I... \"\n\nA wave of relief seems to wash over her as Professor Fergusson puts his hand on her shoulder.\n\n\"Your idea is promising, Nataly, which is why they are here. If you don't trust in yourself, please would you at least trust in my intuition?\n\nNataly shakes her head.\n\n\"Mister President and Vice President!\" she exclaims with a sudden barge of enthusiasm.\n\n\"I am studying Computer Science at the Trimounts Institute. While experimenting with computer to computer communication, which will be the topic of my thesis.... erm what I mean to say is that I have come up with a proposal. If we... if you were to invest substantial ressources, we could setup large system accesspoints in the major Columbian cities like here in Trimounts and setup communication lines separate to the already existing phone and electricity lines. This would allow communication between these small networks. I have put forth a concept for standardized protocols. The handshakes and the... erm what I mean to say is...\"\n\nYou watch as Nataly takes a deep breath, seemingly collecting all the courage she has in herself.\n\n\"Dear President, I would like for you to entrust me with the construction of a Columbian National Computer Network. If succesfull, which I believe it will be, we will be able to setup widespread access to subnetworks like a digital version of the Trimounts library, the government's administrative forms and even implement a system of ordering equipment for frontier outposts, allowing the common Columbian to take advantage of quick and smooth communication with all important bodies of Columbia. It would also allow you to directly communicate with and take statistical data from the voters.\"\n\nShe paused for a moment.\n\n\"Not to mention the possibilities for collaborating on research projects, allowing everyone to share computer tools and to outsource confidential work without having to give away too much of the project itself. I believe that the computer is not only a machine for calculations, but the means for the future extension of our intellectual capabilities. I must ask you to consider my proposal, even if my paper is not to your liking, please.\""
 CLM_v7.1.a:0 "This little Star has a bright future ahead of her."
 CLM_v7.2.t:0 "High up in the castle"
 CLM_v7.2.d:0 "Placeholder text for this event."
 CLM_v7.2.a:0 "I pledge to serve the people."
 CLM_high_king_pledge_mission:0 "The Pledge to the High King"
 CLM_high_king_pledge_mission_desc:0 "To prove to the High King that he is loyal and in servitude to the people, the Vice President has pledged to personally oversee improvements to the lives of the civilians in a few cities. It would be truly unwise to fail one's promise to such powerful figures...\n\nBuild four new civilian factories within 200 days."
