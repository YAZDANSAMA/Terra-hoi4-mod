l_english:
 # Negotiated finite obligations. Native conserved shipments; no spawned aid.
 terra_contract_delivered:0 "Aid Delivered as Promised"
 terra_contract_breached:0 "A Concrete Promise Broken"
 terra_contract_defense_honored:0 "A Defensive Commitment Honoured"
 terra_promises.2.c:0 "Decline politely. No commitment is made."
 terra_promises.2.a:0 "Accept the terms in principle; request their final confirmation."
 terra_promises.2.b:0 "Counter: begin with 150 units instead."
 terra_promises.2.withdraw:0 "The situation has changed. End these talks."
 terra_promises.2.t:0 "A concrete aid offer from [FROM.GetName]"
 terra_promises.2.d:0 "[FROM.GetName] offers to ship 300 infantry-equipment units from its actual stocks. Delivery would be due 14 days after final confirmation, with seven days to remedy a shortfall. We may accept these terms in principle, counter with a smaller 150-unit shipment, or decline. They must confirm the final terms before any obligation exists."
 terra_promises.3.c:0 "Decline politely. No commitment is made."
 terra_promises.3.a:0 "Confirm the 300-unit promise."
 terra_promises.3.withdraw:0 "The situation has changed. End these talks."
 terra_promises.3.t:0 "Final aid terms with [FROM.GetName]"
 terra_promises.3.d:0 "[FROM.GetName] accepts the proposed 300-unit shipment. This is our final decision. Signing commits us to deliver 300 real infantry-equipment units after 14 days; a seven-day grace period follows a stock shortfall. There is no stock transfer now, and no equipment will be created to cover a default. Withdrawing later is a breach."
 terra_promises.4.c:0 "Decline politely. No commitment is made."
 terra_promises.4.a:0 "Confirm the 150-unit promise."
 terra_promises.4.withdraw:0 "The situation has changed. End these talks."
 terra_promises.4.t:0 "Final aid terms with [FROM.GetName]"
 terra_promises.4.d:0 "[FROM.GetName] counters with a smaller 150-unit shipment. This is our final decision. Signing commits us to deliver 150 real infantry-equipment units after 14 days; a seven-day grace period follows a stock shortfall. There is no stock transfer now, and no equipment will be created to cover a default. Withdrawing later is a breach."
 terra_promises.5.a:0 "Record the promise and its deadline."
 terra_promises.5.t:0 "An aid promise is signed"
 terra_promises.5.d:0 "[FROM.GetName] has confirmed the negotiated aid shipment. The donor must supply the agreed 300 units, or 150 under the smaller counteroffer, from its actual infantry-equipment stockpile. No equipment has been granted at signing. Delivery is due in 14 days, with a seven-day grace period if stocks fall short."
 terra_promises.21.c:0 "Decline politely. No commitment is made."
 terra_promises.21.a:0 "Accept in principle. Ask them to confirm 180 days."
 terra_promises.21.b:0 "Counter with a shorter 90-day term."
 terra_promises.21.withdraw:0 "The situation has changed. End these talks."
 terra_promises.21.t:0 "A defensive offer from [FROM.GetName]"
 terra_promises.21.d:0 "[FROM.GetName] offers a real defensive guarantee for 180 days. If a defensive war is observed, its government must help fight a defensive aggressor within a 14-day response window or damage its reputation. We can accept in principle, counter with a 90-day commitment, or refuse. Their final signature is still required."
 terra_promises.22.c:0 "Decline politely. No commitment is made."
 terra_promises.22.a:0 "Sign the 180-day guarantee."
 terra_promises.22.withdraw:0 "The situation has changed. End these talks."
 terra_promises.22.t:0 "Confirm protection for [FROM.GetName]"
 terra_promises.22.d:0 "[FROM.GetName] agrees to a 180-day defensive commitment. The final signature creates a real guarantee. If their defensive war is observed, we must help fight one of its defensive aggressors within 14 days. Normal war-entry choices remain ours; this agreement will never force a player into war through a scripted command. Breaking the promise damages trust and reputation."
 terra_promises.23.c:0 "Decline politely. No commitment is made."
 terra_promises.23.a:0 "Sign the 90-day guarantee."
 terra_promises.23.withdraw:0 "The situation has changed. End these talks."
 terra_promises.23.t:0 "Confirm protection for [FROM.GetName]"
 terra_promises.23.d:0 "[FROM.GetName] agrees to a 90-day defensive commitment. The final signature creates a real guarantee. If their defensive war is observed, we must help fight one of its defensive aggressors within 14 days. Normal war-entry choices remain ours; this agreement will never force a player into war through a scripted command. Breaking the promise damages trust and reputation."
 terra_promises.25.a:0 "A promise we can hold them to."
 terra_promises.25.t:0 "A real guarantee is signed"
 terra_promises.25.d:0 "[FROM.GetName] has signed the defensive guarantee. The negotiated 180-day or 90-day term now exists alongside a real native diplomatic guarantee. If we face a defensive war, their government has a 14-day response window after observation. A voluntary refusal to help can break the commitment; offensive adventures are not covered."
 terra_promises.60.a:0 "They kept their word."
 terra_promises.60.t:0 "[FROM.GetName] delivers its promised aid"
 terra_promises.60.d:0 "The agreed shipment has arrived. These are actual infantry-equipment units transferred from [FROM.GetName]'s stockpile, including available older variants. Keeping a concrete promise has improved our trust in that government and its reputation."
 terra_promises.62.a:0 "A commitment met with real resources."
 terra_promises.62.t:0 "Our aid promise to [FROM.GetName] is fulfilled"
 terra_promises.62.d:0 "The negotiated shipment has left our actual infantry-equipment stocks and reached [FROM.GetName]. This commitment is closed. Its reputation and trust effects have been recorded once; it cannot issue a second shipment."
 terra_promises.65.a:0 "Their promise carried weight."
 terra_promises.65.t:0 "[FROM.GetName] honours its defensive commitment"
 terra_promises.65.d:0 "[FROM.GetName] has honoured the defensive commitment, either by helping against a defensive aggressor or by maintaining the agreed guarantee through its term. The reputation reward is limited to once for this agreement. Help during a war does not erase the remaining term."
 terra_promises.66.a:0 "The grace period is real; prepare the shipment."
 terra_promises.66.t:0 "An aid shipment is short of stocks"
 terra_promises.66.d:0 "Our signed aid promise is due, but our actual infantry-equipment stocks cannot cover the agreed shipment. We have seven days to restore enough equipment. If the deadline passes without a deliverable shipment, the promise will be recorded as a breach. Nothing is created to cover the shortfall."
 terra_promises.68.a:0 "Review the war and our commitment."
 terra_promises.68.t:0 "[FROM.GetName] needs the promised defence"
 terra_promises.68.d:0 "[FROM.GetName] is fighting a defensive war. Our commitment gives us a 14-day response window after its observation. To honour it, we must help fight a country that is a defensive aggressor against them. Use the ordinary diplomacy and war-call interface if we choose to intervene. This event will not join a war for us. Inaction past the window can break the promise."
 terra_promises.70.a:0 "We will remember the difference between words and deeds."
 terra_promises.70.t:0 "[FROM.GetName] breaks a concrete promise"
 terra_promises.70.d:0 "A negotiated commitment by [FROM.GetName] has failed: aid was not delivered by its deadline, protection was not honoured, or the provider withdrew its obligation. No compensating equipment has been granted. The failure is recorded in our trust and grievances and in their reputation."
 terra_promises.72.a:0 "Accept the consequences."
 terra_promises.72.t:0 "Our promise to [FROM.GetName] is broken"
 terra_promises.72.d:0 "The signed commitment was not fulfilled. The agreement is closed and cannot later grant equipment or a reputation reward. [FROM.GetName] has recorded the failure, and our credibility has suffered."
 terra_promises.73.a:0 "Close the file without inventing a delivery."
 terra_promises.73.t:0 "A commitment is closed"
 terra_promises.73.d:0 "The agreement has ended because its beneficiary released it or the diplomatic situation no longer supports it. No undelivered equipment was removed or granted. Guarantees created by this agreement are removed. A voluntary withdrawal or incompatible policy change by the provider can still be recorded as a breach."
 terra_promises.80.a:0 "No promise, no delivery."
 terra_promises.80.t:0 "Negotiations close without a promise"
 terra_promises.80.d:0 "The proposed agreement was declined, withdrawn, or overtaken by events. No final commitment was signed, no guarantee was created, and no equipment was transferred. Political capital spent on negotiations is not refunded merely because the other government said no."
