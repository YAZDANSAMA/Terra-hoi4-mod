l_english:
 VCT_victorian_industrial_engine: "Victorian Industrial Engine"
 VCT_victorian_industrial_engine_desc: "Victoria stands among Terra's foremost industrial powers. Dense networks of factories, workshops and mobile-city infrastructure give the empire the means to equip vast armies and sustain ambitious projects."
 VCT_imperial_overextension: "Imperial Overextension"
 VCT_imperial_overextension_desc: "Victoria's reach stretches far beyond the heartland. Maintaining distant interests, powerful nobles and an enormous military establishment places constant strain upon the imperial administration and its logistics."
 VCT_steam_knight_tradition: "Legacy of the Steam Knights"
 VCT_steam_knight_tradition_desc: "Victoria's martial prestige is inseparable from its armored champions and the engineering tradition that sustains them. Even where the great machines themselves are scarce, their doctrine continues to shape the army."
 VCT_gallic_reparations: "Gallic Reparations"
 VCT_gallic_reparations_desc: "Emerging as the victtor in the brutal Gallo-Victorian War, Gaul's victory in the Gallo-Victorian War was costly, but the peace it dictated was harsher still. The reparations imposed upon the young Victorian nation have not broken it, yet they have bred a lasting bitterness toward Gaul and its habit of meddling in Victorian affairs.\n\n§RWhen the opportunity comes, we will make sure those Liberi will never humiliate us again.§!"
 VCT_LGL_reps: "Gallic Reparations"

 victoria_gt.1.t: "A Welcoming Offer"
 victoria_gt.1.d: "The carriage had barely stopped when the doors of the Gusev estate swung open.\n\nJonathan Tracey, a diplomat of 20 odd years now, had braced himself for a cold reception. He had read the reports on the Ursus court: prideful, boastful, and most certainly always on the brink of war.\n\nInstead, he found servants waiting with warm cloaks, a table laid with tea and honey cakes, and a staff that was all too welcoming.\n\n\"Welcome to my humble abode, my friend!\" Count Mikhail Gusev exclaimed as he descended his staircase. \"I hope the journey here wasn't too harsh on you, especially with this harsh winter setting in.\"\n\n\"Please, Count Gusev,\" Tracey replied with a rare bow. \"You humble me.\"\n\n\"Oh, where are my manners?\" Gusev motioned for Tracey to follow him. \"Come, let us chat for a bit. Surely, business can wait.\"\n\nAfter a few minutes of small talk and banter, the negotiations comenced. Count Gusev was nervous and inexperienced, that much was obvious. He gripped his notes a little too tightly and laughed a little too quickly with a slight shrill. But he was also sincere, and sincerity was a rare currency in diplomacy.\n\nAnd it was certainly something Tracey had come to cherish in his career.\n\nBy the time the tea had gone cold, the proposal lay open between them. Victoria hands Ursus its artillery and warship blueprints, and in exchange, it receives Ursus armor and weaponry. The terms were fair. Unusually fair.\n\nToo fair, perhaps?\n\nTracey turned the question over in his mind. Londinium would want an answer."
 victoria_gt.1.a: "\"This will indeed prove beneficial to us. We accept the treaty.\""
 victoria_gt.1.b: "\"It pains us to say this, but Victoria is not in a position to accept the treaty at this time.\""

 victoria_gt.2.t: "The Negotiating Table"
 victoria_gt.2.d: "The cold winter outside gave Jonathan Tracey an accurate sense of what's to come when he stepped foot into the Gusev manor.\n\nTracey was shown into a sitting room and told, with every courtesy, that the count would be down shortly.\n\nShortly turned out to be twenty minutes. Not quite an insult, exactly, for someone as experienced as him.\n\nNot quite an apology either.\n\nTracey had endured worse with the various dukes in Victoria and far worse with the Witch King's people, so he passed the time reading the spines on the bookshelves. An old habit of his, when he needed to pass the time. Even though he never was an avid reader.\n\nWhen Count Gusev finally appeared, he was composed, if a little pale. The talks that followed were what talks always are: careful, procedural, and slightly dull. Gusev defended his position with more spine than his age suggested, though he glanced at his notes more often than he would have liked.\n\nNothing atypical of what Tracey usually went through.\n\nThe proposal on the table was simply a proposal, neither a gift nor a trap.\n\nAll that remained was to decide whether Victoria wanted it."
 victoria_gt.2.a: "\"The terms are acceptable. We will reach out shortly with the specifics.\""
 victoria_gt.2.b: "\"Unfortunately, Victoria isn't ready for a treaty such as this.\""

 victoria_gt.3.t: "Tense Negotiations"
 victoria_gt.3.d: "\"The Count is occupied for the better part of the day, I'm afraid.\"\n\nTracey had been kept waiting for the past hour or so when the servant informed him such, with the air of a man reciting a line he did not care for. Should the Victorian gentleman find this arrangement unsatisfactory, the servant recited, the household guards would be happy to assist him to the door.\n\nJonathan Tracey had not crossed a frozen continent to be threatened by a footman. He had faced unruly nobles and uncooperative diplomats before, but never in his 20-odd year career did he encounter such an insult to him and Victoria.\n\nWhen Gusev finally entered, the temperature of the room dropped several degrees. The count was stiff and defensive, reciting  a speech about firmness that he had definitely rehearsed in a mirror. Tracey's ears grated as he attempted to place his opinion on the matter, only to be immediately shot down by the Count with something about Ursus might and power, as if Victoria had no say in the matter whatsoever.\n\nAnd yet, the terms themselves were not unreasonable.\n\nThat was what irritated Tracey most.\n\nBeneath the posturing, the offer was a good one for both parties. It had simply been delivered by a dimwit who believed power was the way to win in a negotiation. A lesson that, in a normal scenario, Tracey would be sure to teach him of.\n\nThe meeting ended without a handshake. As Tracey was given the documents to sign, he, no, Victoria made her decision."
 victoria_gt.3.a: "\"Victoria will not let her pride get in the way of a mutual benefit. We accept your offer.\""
 victoria_gt.3.b: "\"We did not come here to be insulted like this. We are leaving.\""