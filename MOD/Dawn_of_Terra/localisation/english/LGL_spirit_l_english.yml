l_english:
 LGL_military_spirit: "La Grande Armée"
 LGL_military_spirit_desc: "The Grande Armée stands as Terra's premier fighting force, forged in centuries of triumph and crowned by our recent victory in the Gallo-Victorian War. Yet behind this martial glory lies a dangerous reality: our command is stagnant, and our tactics are relics of a bygone era. If we want to cement our dominance across Terra for years to come, we must confront the failures of our past and drag our military into the modern age."

