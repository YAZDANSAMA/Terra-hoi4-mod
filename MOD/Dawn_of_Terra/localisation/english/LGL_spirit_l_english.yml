 LGL_gallic_hegemony: "Waning Gallic Hegemony"
 LGL_gallic_hegemony_desc: "Gaul enters the 11th century with unprecedented global influence, won through the rapid growth and expansion of the past few centuries. Yet this dominance has bred decadence within its noble courts and bureaucracy, and Gaul has fallen into stagnation as its neighboring powers continue to eye the fading empire. As Corsica I rose to the throne to lead forth a new Gallic Era, he seeks to remedy these ills by any means possible.\n\n§REven if it means we must shed our countrymen's blood once more.§!"

 LGL_victorian_reparations: "Victorian Reparations"
 LGL_VCT_reps: "Victorian Reparations"
 LGL_victorian_reparations_desc: "Emerging as the victtor in the brutal Gallo-Victorian War, Gaul's victory in the Gallo-Victorian War was costly, but the peace it dictated was harsher still. The reparations imposed upon the young Victorian nation have not broken it, yet they have bred a lasting bitterness toward Gaul and its habit of meddling in Victorian affairs.\n\n§RWe must be careful not to provoke a cornered lion more than once. Especially one that can still bite back.§!"

 LGL_leithanien_gifts: "Gifts to Leithanien"
 LGL_leithanien_gifts_desc: "The gifts we sent and promised to Leithanien are expensive for our civilian and military economy. If an enemy were to attack us, our industry will not be able to keep up."
 LGL_military_administration: "Leithanien Military Administration"
 LGL_military_administration_desc: "Sending the majority of our general staff and army to oversee the military administration places a massive strain on our domestic forces. We should take care to be vigilant of our neighbors in case of an attack on us."