 LGL_lei_3_desc: "+pp\n+mp\n"
 LGL_urs_nonagg_friend: "Drinks with Ivan"
 LGL_urs_nonagg_friend_desc: "gaul holds party w/ ursus and concedes territories+factories to guarantee nonaggression pact\n\nevent:\n++consumer goods\n--potential to territories\nnonaggression (ursus) (1+ yr)"
 LGL_urs_nonagg_aggro: "Distract the Bear"
 LGL_urs_nonagg_aggro_desc: "gaul incentivizes tribal riots and Kazimierzian separatists to cause havoc in ursus\n\nursus:\n+spirit that disallows wars for years depending on luck and reduces factory output and manpower\n-stab\n\ngaul:\n-ursus opinion\n+kazimierz opinion\n--equipment\n++consumer goods"
 LGL_wo4e_prelude: "Send the Envoys"
 LGL_wo4e_prelude_desc: "after 1 aug 1039\n\ntrigger leithanien event:\n!> leithanien submits\n!> leithanien denies (historical)"
 LGL_wo4e_skip: "The Muted Kaiser"
 LGL_wo4e_skip_desc: "focus if leithanien yields (non-historical)"
 LGL_wo4e_start: "Silence the Kaiser"
 LGL_wo4e_start_desc: "focus if leithanien goes to war (historical)"
 
 LGL_military_spirit: "La Grande Armée"
 LGL_military_spirit_desc: "The Grande Armée stands as Terra's premier fighting force, forged in centuries of triumph and crowned by our recent victory in the Gallo-Victorian War. Yet behind this martial glory lies a dangerous reality: our command is stagnant, and our tactics are relics of a bygone era. If we want to cement our dominance across Terra for years to come, we must confront the failures of our past and drag our military into the modern age."

