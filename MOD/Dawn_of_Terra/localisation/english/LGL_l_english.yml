 LGL_vic_2_desc: "+forts on victorian southern border"
 LGL_lei_2: "Decry the Witch King"
 LGL_lei_2_desc: "leithanien:\n-stab\n-opinion of gaul\n\nother nations:\n-opinion of leithenien\n-chance to send them aid via lend lease or volunteers"
