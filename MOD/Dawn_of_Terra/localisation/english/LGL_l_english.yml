 LGL_urs_2_desc: "Enter the focus description here."
 LGL_econ_final: "Le Rêve Éternel"
 LGL_econ_final_desc: "spirit:\n--consumer goods\n++construction speed\n"
 LGL_military_final: "Enshrine the Grande Armeé"
 LGL_military_final_desc: "spirit:\n++atk\n++org\n++speed"
 LGL_vic_nonagg_friend: "Repay the Victorians"
 LGL_vic_nonagg_friend_desc: "gaul pays reparations to victoria for nonaggression pact\n\n++consumer goods\n-stability\n+guaranteed nonaggression pact w/ victoria (1+ yr)"
 LGL_vic_nonagg_aggro: "Cripple the Lion"
 LGL_vic_nonagg_aggro_desc: "gaul launches critical infrastructure attacks w/ help from taran nationalists\n\nvictoria:\n+spirit that disallows wars for years depending on luck and reduces factory output and manpower\n-stab\n\ngaul:\n-victoria opinion\n-gaul opinion\n++consumer goods\n--infantry equipment"
