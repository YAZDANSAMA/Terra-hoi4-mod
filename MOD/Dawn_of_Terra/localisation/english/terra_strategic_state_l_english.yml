 terra_state_fatigue_tt:0 "War fatigue: §Y[?This.terra_state_fatigue|0] / 100§!\nLong wars, offensive campaigns and internal strain accumulate fatigue. Stable peace allows gradual recovery."
 terra_state_defeat_memory_tt:0 "Memory of defeat: §Y[?This.terra_state_defeat_memory|0] / 100§!\nCapitulation leaves a lasting strategic memory. A change of ruler does not erase it."
 terra_state_reputation_tt:0 "International reputation: §Y[?This.terra_state_reputation|0] / 100§!\nDelivered commitments build credibility; aggressive declarations and broken commitments damage it. Quiet peace slowly restores a damaged reputation toward its neutral baseline."
 terra_state_domestic_pressure_tt:0 "Domestic pressure: §Y[?This.terra_state_domestic_pressure|0] / 100§!\nStability, war support, available reserves, equipment, civil conflict and strategic trauma constrain discretionary foreign policy."
 terra_state_subject_duty_tt:0 "Subject obligations remain in force despite fatigue or domestic pressure. The country still uses its actual army, equipment and ordinary diplomatic rules."
 terra_state_goals_tt:0 "Strategic priorities adapt to the current ruler, government, domestic condition and territorial interests. Recovery takes priority while the state remains severely strained."
