l_english:
 terra_strategic_council:0 "Strategic Council"
 terra_strategic_council_desc:0 "Read the reasons behind national planning and our assessment of foreign policy."
 terra_review_national_strategy:0 "Review our national strategy"
 terra_review_national_strategy_desc:0 "Ask the council about priorities, internal pressure and wartime limits."
 terra_review_foreign_strategy:0 "Assess [From.GetNameDef]"
 terra_review_foreign_strategy_desc:0 "Review the public strategic picture and our intelligence confidence. These assessments do not predict individual battles."
 terra_brief.1.t:0 "Our Strategic Council"
 terra_brief.11.t:0 "Assessment of [From.GetNameDef]"
 terra_brief.close:0 "Understood."
 terra_brief.1.d:0 "Leader profile: [Root.GetTerraStrategicPersona]\n\nLong-term priority: [Root.GetTerraStrategicGoal]\nWar fatigue: [Root.GetTerraStrategicFatigue]\nDefeat memory: [Root.GetTerraStrategicDefeat]\nDomestic pressure: [Root.GetTerraStrategicDomestic]\nInternational reputation: [Root.GetTerraStrategicReputation]\n\nReason for current planning: [Root.GetTerraStrategicReason]"
 terra_brief.11.d:0 "Leader profile: [From.GetTerraStrategicPersona]\n\nCurrent strategic picture: [From.GetTerraStrategicReason]\n\nOur diplomatic view: [Root.GetTerraDiplomaticView]\n\nOur military intelligence: [Root.GetTerraEstimateConfidence]\nOur escalation notice: [Root.GetTerraEscalationNotice]\n\nThe council uses current observations and persistent diplomatic memory. Supply, allies, terrain and hidden preparations can still overturn the estimate."
 terra_brief_persona_pragmatic:0 "Pragmatic: seeks workable gains and keeps expensive commitments under review."
 terra_brief_persona_mercantile:0 "Commercial: favours stable neighbours, trade and affordable cooperation."
 terra_brief_persona_imperial:0 "Imperial: values prestige and territorial revision, but must pass reserve and intelligence checks."
 terra_brief_persona_guardian:0 "Guardian: prioritises the realm, dependable allies and defensive obligations."
 terra_brief_persona_idealist:0 "Idealist: values compatible governments and a dependable reputation."
 terra_brief_persona_cautious:0 "Cautious: demands stronger evidence and reserves before risking escalation."
 terra_brief_goal_recovery:0 "Recovery: restore reserves and political stability before another offensive."
 terra_brief_goal_revision:0 "Revision: recover disputed core territory when the opportunity is sustainable."
 terra_brief_goal_commerce:0 "Commerce: invest in civilian growth and cooperative neighbours."
 terra_brief_goal_security:0 "Security: protect the homeland and the alliance network."
 terra_brief_fatigue_high:0 "Severe: prolonged fighting is constraining new operations."
 terra_brief_fatigue_medium:0 "Growing: commitments and offensives need tighter limits."
 terra_brief_fatigue_low:0 "Limited: immediate supply and political conditions still matter."
 terra_brief_defeat_high:0 "Deep: previous defeats favour recovery and a wider safety margin."
 terra_brief_defeat_medium:0 "Present: the last defeat remains part of planning."
 terra_brief_defeat_low:0 "Limited: no heavy recent defeat memory."
 terra_brief_reputation_high:0 "Dependable: fulfilled obligations support diplomatic confidence."
 terra_brief_reputation_medium:0 "Mixed: partners weigh its bilateral record alongside public conduct."
 terra_brief_reputation_low:0 "Damaged: aggression or broken obligations discourage trust."
 terra_brief_domestic_high:0 "Severe: stability, war support or reserves constrain policy."
 terra_brief_domestic_medium:0 "Strained: domestic needs compete with foreign ambitions."
 terra_brief_domestic_low:0 "Manageable: domestic pressures currently permit normal planning."
 terra_brief_reason_subject:0 "It is a subject: the AI prioritises its overlord’s war calls. Its own front still follows supply and recovery limits."
 terra_brief_reason_recovery:0 "The council favours rebuilding. New offensive plans and distant force allocations fail the recovery checks."
 terra_brief_reason_supply:0 "The council favours conserving the army because manpower, rifles or unlocked transport reserves are insufficient."
 terra_brief_reason_war:0 "The council is conducting an existing war. It balances fronts, aids allies when forces can be spared, and accelerates only against a clearly weaker assessed enemy."
 terra_brief_reason_revision:0 "The council considers recovering core territory. A warning, adequate reserves, a legal war goal and a conservative estimate of the opposing coalition are all required."
 terra_brief_reason_commerce:0 "The council favours cooperation and civilian investment. Hostility alone offers little reason to risk these gains."
 terra_brief_reason_security:0 "The council favours deterrence and defensive partners. Shared threats can raise alliance and containment priorities."
 terra_brief_intel_high:0 "Higher confidence: intelligence supports a narrower safety margin; it is still an estimate, not a forecast of victory."
 terra_brief_intel_medium:0 "Partial confidence: planners require roughly a 1.5 to 1 estimated advantage before escalation."
 terra_brief_intel_low:0 "Low confidence: planners require roughly a 1.8 to 1 estimated advantage before escalation."
 terra_brief_relation_betrayal:0 "Betrayal dominates its memory of us; ordinary goodwill offers will face strong resistance."
 terra_brief_relation_distrust:0 "Significant grievances remain; repair and concrete commitments matter more than words."
 terra_brief_relation_welcome:0 "Its remembered relationship with us currently supports cooperation."
 terra_brief_relation_neutral:0 "Its position is conditional; our interests, conduct and future commitments can change it."
 terra_brief_notice_mature:0 "Our warning period has elapsed. This opens preparation only; native war rules and capability checks still apply."
 terra_brief_notice_pending:0 "We have issued a warning and are still allowing time for diplomacy."
 terra_brief_notice_none:0 "We have no active escalation notice for this country."
