l_english:
 CLM_parliament_balance:0 "The Great Experiment: Parliament"
 CLM_parliament_balance_desc:0 "The seats of the Senate and the House of Representatives shape the mood of the republic. A single party holding more than 55% of the House, a House in which no party reaches 30%, and every single seat held by the Dissidents all wear down the Experiment: stability falls, and it falls a little more every week."
 CLM_np_popular:0 "The §RNational Party§! holds at least §Y30%§! of the seats in the House of Representatives"
 CLM_fdp_popular:0 "The §BFederal Democratic Party§! holds at least §Y30%§! of the seats in the House of Representatives"
 CLM_la_popular:0 "The §YLiberal Alliance§! holds at least §Y30%§! of the seats in the House of Representatives"
 CLM_sd_popular:0 "The §OSocial Democrats§! hold at least §Y30%§! of the seats in the House of Representatives"
 CLM_election_missions_category:0 "The Second Term"
 CLM_charter_democracies:0 "Columbian Charter"
 CLM_time_to_shine_mission:0 "Time to Shine"
 CLM_time_to_shine_mission_desc:0 "Mark Max has asked for the stage, and he wants it to be perfect. The republic must be calm and the people confident before the curtain rises: stability at 100% and war support above 50% (above 90% if at war). The staging costs 500 political power."
 CLM_budget_surplus_mission:0 "A huge budget surplus waiting to be spent"
 CLM_budget_surplus_mission_desc:0 "The coffers are full and the Federal Budget is balanced. In a year the money will find its way into the factories of the republic."
 CLM_v5.1.t:0 "Time to Shine"
 CLM_v5.1.d:0 "The hall is full and the lights are low. Mark Max has asked for the stage, and for once nobody is quite sure what he intends to say.\n\nA speech like this needs a calm country behind it: a stable republic, a confident people and a treasury willing to pay for the lighting. If everything is in order, Max will give the performance of his life.\n\nIf not, he will only get one chance."
 CLM_v5.1.a:0 "Only one chance."
