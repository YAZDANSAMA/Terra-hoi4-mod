l_english:
 ursus_gt.1.t: "Meeting the Victorian Envoy"
 ursus_gt.1.d: "Count Mikhail Gusev, Ursus's very own representative for the new technological exchange talks, stood in front of his mirror with an expression unbefitting for a noble of his status.\n\nIt was anxiety.\n\nHe had practiced the talking points. Read and reread the proposal drafted and signed by his peers multiple times. Even did a few practice runs with his wife over the past week.\n\nBut the young noble was still young and inexperienced. In the world of politics and diplomacy, Gusev was practically a child. He had little social standing apart from a few mines he owned in the north, and he only got this job because...\n\n...because his seniors needed a scapegoat in case it all failed.\n\nStill, Gusev was not one to admit defeat. He was entrusted with an important task: establishing a technological exchange treaty with the incoming Victorians. He even received an audience with the Tsar, something not many of his age and experience was able to secure. Even though he knew that he was the poster boy for this entire negotiation, he still decided to give it his all and let fate dictate the rest.\n\nA servant briefly opened the door.\n\n\"The Victorians are here, sir.\"\n\nGusev straightened his posture. His day had finally came. If he succeeds, his name will be enshrined within the noble world for years to come.\n\nHe turned towards his servant."
 ursus_gt.1.a: "\"Excellent. Make sure you welcome them as if they are our own people.\""
 ursus_gt.1.b: "\"Let them know I will be down soon.\""
 ursus_gt.1.c: "\"Tell them they can wait. If they refuse, call for the guards.\""

 ursus_gt.2.t: "The Gusev-Tracey Pact"
 ursus_gt.2.d: "Ivan quietly read the report.\n\nThat young noble he met a few weeks ago and whose proposal he approved really went through with it, and got the Victorians to give up their technological secrets.\n\nIn a sense, he felt a sense of pride in his fellow countryman. He looked out the window. Smokestacks arose from the factories as supervisors redirected the workers to start the production lines on the new designs. His best engineers are pouring themselves over the Victorian blueprints, as Messengers traversed the land to solidify Ursus's part of the deal.\n\nHe heard a knock on his door.\n\n\"Speak.\"\n\n\"A group of nobles have requested an audience, sir.\"\n\nIvan remembered the rumors. He wasn't deaf, after all, to how the masterminds behind this treaty were a cabal of nobles who wanted to use Count Gusev as the face of the negotiations and potential scapegoat. Of course, he plans to remedy this one way or another.\n\n\"Tell them that I have retreated for the day,\" he ordered."
 ursus_gt.2.a: "\"And if they insist, use the guards to kick them out.\""

 ursus_gt.3.t: "A Disappointing Message"
 ursus_gt.3.d: "In a quiet study, three men sat with brandy and a copy of the Victorian reply.\n\n\"That Gusev noble really torched the negotiations, didn't he?\" one of them asked. The others nodded.\n\nIt did not go well at all. Whatever happened at the Gusev manor was left up to interpretation, but that didn't matter. What did was the end result.\n\nAnd the end result is that the Victorians left unhappy, and Ursus was left with an unsigned treaty.\n\n\"As far as the Tsar is concerned,\" another replied, \"it was all Gusev's idea.\" They nodded again.\n\nIt was Gusev who spoke to the Victorians. Who brought the proposal to the Tsar. Who held the copies given to him by the cabal.\n\nAnd who will be the one taking the blame for all of this.\n\nThe talks had been expected to succeed, and it probably would have if it had been any other negotiator. But alas, fate really had dictated it's course.\n\nIn the end, there was nothing he could've done."
 ursus_gt.3.a: "\"Perhaps we were too hasty in trusting that Gusev boy.\""
