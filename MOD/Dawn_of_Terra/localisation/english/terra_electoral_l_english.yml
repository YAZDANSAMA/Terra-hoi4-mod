 CLM_electoral.1.t:0 "Rural Campaign Complete"
 CLM_electoral.1.d:0 "Our campaign through the countryside of [GetElVisitStateName] is over. Locals have appreciated the gesture of [GetElVisitPartyName]. It gained §Y3§! representatives."
 CLM_electoral.1.a:0 "For the common man!"
 CLM_electoral.2.t:0 "Police Forces Bolstered"
 CLM_electoral.2.d:0 "The local police forces of [GetElVisitStateName] have been visited and supported. The [GetElVisitPartyName] gained §Y4§! representatives due to the appreciation of their efforts."
 CLM_electoral.2.a:0 "A safe citizen is a happy citizen!"
 CLM_electoral.3.t:0 "A Speech to the State"
 CLM_electoral.3.d:0 "Our grand speech across [GetElVisitStateName] was received with great enthusiasm. The [GetElVisitPartyName] are sure to benefit massively from this."
 CLM_electoral.3.a:0 "Hail, Columbia!"
