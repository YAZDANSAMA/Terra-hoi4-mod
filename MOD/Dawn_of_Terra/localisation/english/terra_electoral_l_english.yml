 CLM_electoral.4.t:0 "Senators Pardoned"
 CLM_electoral.4.d:0 "Sometimes all it takes is to pardon a few minor crimes... or a few major, and suddenly you are their hero. If it is undemocratic, why is it a right enshrined in the constitution? Right, you wrote the constitution.\n\nThe [GetElVisitPartyName] now hold the Senate seats of [GetElVisitStateName], but lost up to §Y5§! representatives there."
 CLM_electoral.4.a:0 "For the greater good"
 CLM_electoral.5.t:0 "Targeted Federal Funding"
 CLM_electoral.5.d:0 "Some states just seem to receive more federal funding than others. Surely just a coincidence, right?\n\nThe [GetElFundPartyName] now hold the Senate seats of [GetElFundStateName] and gained §Y2§! representatives there."
 CLM_electoral.5.a:0 "We still need to name the bridge after the senator"
 CLM_infra_grants_mission:0 "Targeted Infrastructure Grants"
 CLM_infra_grants_mission_desc:0 "Build infrastructure in [GetElFundTargetName] to channel federal funds where they are needed most. If completed, the [GetElFundPartyName] take the Senate seats of [GetElFundStateName] and gain representatives there."
