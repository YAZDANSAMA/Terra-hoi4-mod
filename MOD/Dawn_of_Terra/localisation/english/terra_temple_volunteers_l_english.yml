l_english:
 TNJ_temple_volunteers:0 "Temple Volunteers"
 TNJ_temple_volunteers_desc:0 "The temples of Ta-Netjer provide volunteers for the armies of Sargon and the Satrapy of Minos.\n\nMonthly manpower sent: §R-2,000§!\nTo Sargon: §Y1,000§!\nTo the Satrapy of Minos: §Y1,000§!\n\nThe full transfer takes place once each month while all three national spirits are active and all three countries exist and have not capitulated. At least §Y2,000§! free manpower must remain in Ta-Netjer before payment; otherwise that month's transfer is skipped."
 SGN_tnj_reinforcements:0 "Ta-Netjer Reinforcements"
 SGN_tnj_reinforcements_desc:0 "The temples of Ta-Netjer reinforce the royal army with volunteers.\n\nMonthly manpower received: §G+1,000§!\n\nThese men are transferred from Ta-Netjer's existing manpower reserve. Payment requires all three participating countries and national spirits, no capitulated participant, and at least §Y2,000§! free manpower in Ta-Netjer."
 MSN_tnj_auxiliaries:0 "Ta-Netjer Auxiliaries"
 MSN_tnj_auxiliaries_desc:0 "Volunteers from the temples of Ta-Netjer serve alongside the forces of the Satrapy of Minos.\n\nMonthly manpower received: §G+1,000§!\n\nThese men are transferred from Ta-Netjer's existing manpower reserve. Payment requires all three participating countries and national spirits, no capitulated participant, and at least §Y2,000§! free manpower in Ta-Netjer."
