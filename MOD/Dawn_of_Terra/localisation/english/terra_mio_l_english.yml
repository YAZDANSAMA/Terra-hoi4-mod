 CLM_raythean_desc:0 "Founded by Henry Bloch and Owen Brynley, Raythean Industries was a de facto successor to the Gaulish Third Arsenal after the Battle of the Four Emperors. What began as a small workshop soon became the preferred supplier of small arms for the pioneers of the frontlines and the Union Army. Following its massive success, and honoring the wishes of its founder Bloch, Raythean has expanded its operations and RnD section to encompass heavy vehicles and specialised equipment. It is at the forefront in the research of Originium electronic equipment and a catalyst for advanced civilian manufacturing methods.\n\nEmpowered by its support from the central government, Raythean is sure to propel Columbia's industry into a new future, albeit with less leeway for Max and the Vice President."
 CLM_columbia_general_electrics_desc:0 "This company keeps the lights on from the capital to the farthest frontier outpost, and its laboratories are steadily bringing new electrical wonders to the Columbian market."
