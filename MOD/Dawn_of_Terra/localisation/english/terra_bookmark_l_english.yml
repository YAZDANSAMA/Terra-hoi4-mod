l_english:
 TERRA_1028_BOOKMARK:0 "Dawn of Terra — 1028"
 TERRA_1028_BOOKMARK_DESC:0 "Four great thrones stand at the center of a changing Terra."
 TERRA_1028_VCT_DESC:0 "Victoria is a constitutional monarchy ruled by King Frederick III, with an aristocratic Parliament and hereditary nobles shaping the affairs of the realm. Its people are predominantly Feline, with a substantial Vouivre population; the Aslan and Draco houses represent the empire's royal traditions.\n\nVictorian culture celebrates liberty and romantic ideals alongside imperial prestige and industrial progress. Noble birth and access to education shape social standing, leaving a wide gap between privileged households and ordinary people. The ambitions of the ruling classes do not always command the loyalty of the wider population."
 TERRA_1028_URS_DESC:0 "Ursus is an absolute monarchy under Tsar Ivan Yevgenyevich, whose authority governs both the state and its armies. Aristocrats and military commanders administer the empire, while loyalty to the throne and obedience to imperial command define public duty. Most of its people belong to the Ursus race, alongside communities of other Terran races.\n\nMilitary strength and service to the empire dominate its public ideals. Literature, theatre, and folk songs also hold an important place in Ursine life, giving its people a cultural identity that extends beyond the army and imperial court."
 TERRA_1028_LTH_DESC:0 "Leithanien is an elective monarchy whose regional rulers, the Kurfürsten, choose the Kaiser. Under the Witch King, imperial authority has grown at their expense, while reforms have opened education and advancement to talented commoners. Its population is predominantly Caprinae and Elafia, with Lupo communities in the southeast.\n\nMusic, scholarship, and Originium Arts lie at the centre of Leithanian life. Artistic accomplishment carries social prestige, and music gives form to both philosophy and emotion. This pursuit of knowledge flourishes under a ruler who also demands obedience and suppresses political dissent."
 TERRA_1028_LGL_DESC:0 "Gaul is an imperial monarchy ruled by Emperor Corsica I and a Liberi royal house. Its court divides authority between the Nobles of the Robe, who oversee civil affairs and finance, and the Nobles of the Sword, who direct the military. Its population comprises varied races, while Gaulish culture enjoys influence across Terra.\n\nArt, philosophy, and refined urban life stand at the heart of that culture. Imperial prestige and military glory also carry great weight, while inherited rank gives the aristocracy a central place in government and society."
 TERRA_1028_OTHER_DESC:0 "Select another nation on the map."
