 TNJ_home_guard_limit:0 "Ta-Netjer maintains ten permanent home-guard divisions. Raising, copying, changing or disbanding division templates is restricted. Existing guards can still receive replacement manpower and equipment."
 TNJ_home_guard_policy:0 "Ta-Netjer protects its sacred territory. It does not accept calls to foreign wars, declare wars or send volunteers. Equipment aid and the monthly transfer of temple recruits remain available."
