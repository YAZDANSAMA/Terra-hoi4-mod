l_english:
 gaul.100.t: "Envoy to Leithanien"
 gaul.100.d: "The preparations for Leithanien's submission are complete. Upon the council table lies a single sealed parchment: Gaul's offer to the Witch King. Submit to the empire, and his family will be bound to the imperial house through marriage.\n\nCorsica I stood at the window as the envoy's caravan was readied in the courtyard below. He listened as the ministers argued behind him. Some urged generosity. Chests of gold, fine silks, and promises of land and title would show the Witch King an empire extending a hand in friendship rather than demanding one. Others scoffed. To walk unarmed into the house of that accursed man was to invite disaster. Let the envoy ride beneath a guard of soldiers and casters, so that none could doubt the strength standing behind the request.\n\nHe knew that that accursed king would refuse them all. After all, it was just an excuse to go to war against them. But he said nothing. Instead, he turned around, and issued his order,"
 gaul.100.a: "\"Send him some gifts. Let's see if he falls for the carrot.\""
 gaul.100.b: "\"Send the soldiers. The Witch King must know not to invite the stick.\""

 gaul.101.t: "Leithanien submits"
 gaul.101.d: "The envoy returned at dawn, riding at the head of a Leithanian escort with a sealed letter held high. The gates of Lingones opened before him, and he walked into the throne room with his head raised. He walked up to the emperor with a solemn yet prideful expression, and handed the letter to him. Corsica I opened it, and a single tear fell from his eye. He stood up, and declared,\n\n§G\"Leithanien has submitted to our nation!\"§!\n\nThe court erupted. Nobles who had spent weeks whispering of war now raised their glasses, and even the emperor allowed himself a thin smile. That night, bells rang across Lingones. Lavish parties were held at the manors of nobles, as the streets of the cities were filled with joy and laughter over such a simple victory. Meanwhile, behind closed doors, ministers and generals squabbled, arguing over who would govern their new vassal. \n\n Corsica looked out the window, watching as the celebrations continued in the streets of Lingones. He heard the door open, and recognized the footsteps of his wife, the Empress-Consort.\n\n\"Why don't you go and partake in the celebrations?\" she asked. He turned to her, and smiled."
 gaul.101.a: "\"There's still lots of work that needs to be done, my love. We can't afford to be complacent now.\""

 gaul.102.t: "Leithanien refuses"
 gaul.102.d: "The caravan arrived at dawn, drawn by a single Gallic driver who would not meet our eyes. In its bed stood a statue of our envoy, their faces petrified in fear as they raised their hands to block whatever was coming towards them. The message was clear: \n\n§R\"Leithanien refuses to submit.\"§!\n\nThe court has fallen silent. The nobles looked away in horror, and the emperor's face twisted in disgust.\n\nLater, in the castle's war room, generals gathered around as Corsica I sat at the head of the table. He watched as they bickered and bickered, going on and on about how to respond to Leithanien's insult. As the voices grew louder, his mind became weary, and his thoughts became clearer as his anger and rage solidified into something...quiet.\n\nFinally, he arose, and the generals all fell silent. He looked at them all in the eyes, and declared,"
 gaul.102.a: "\"Prepare for war. They will pay for their treachary.\""
 gaul.102.b: "\"We must bide our time. We are not prepared yet.\""

 LTH_envoy_refuse_tt: "Leithanien has killed our envoys!"
 LTH_envoy_submit_tt: "Leithanien has submitted to our rule."
