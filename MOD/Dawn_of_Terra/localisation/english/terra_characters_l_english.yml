 CLM_mark_max_desc:0 "Mark Max, although appearing only as a simple puppet, has been the president of Columbia since its independence. Yet only a select few know that he is actually a machine, an artificial intelligence created during the age of the predecessors. After his core was excavated during the Columbian Revolutionary War, he aided the Columbians and helped them to victory, becoming their first president after a landslide victory and securing a permanent position in government. His cold and calculating nature has allowed Columbia to turn into a superpower. There are however many voices that fear that the harmless looking liberi may cause an abrupt end to the young democracy, if it deems it necessary."
