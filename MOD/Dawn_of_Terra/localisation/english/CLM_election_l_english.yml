 CLM_election.1.t:0 "An unexpected result"
 CLM_election.1.d:0 "While we, fortunately, always had more than a single party in Columbia due to the fact that the very first government had been formed by military personnel and small business owners, never before have so many parties signed up to run for Vice President. Due to the number of parties no single party can gain a majority, but this merely ensures that compromises must be made and that no single faction gains too much power, at least in theory.\n\nIn the center of it all we have the three so-called gentlemen:\nThe National Party has traditionally always been very pro military due to its origins in the revolutionary war. Most of its members are current or former officers in the armed forces, but there are also some larger business owners who see in the NP someone who shares their interests in expanding Columbian business abroad. This year they are led by Richard Grants, the son of Admiral Joseph Grants of the Columbian Navy. His agenda sees the expansion of Columbian military technology to a modern standard and tackling the severe lack of equipment.\nThe Federal Democratic Party was the other founding faction during the revolutionary war. While it used to be the overall larger party and just an everybody party, developments quickly led to a split between the pro-state and pro-government FDP that seeks to strengthen Columbia domestically and the Liberal Alliance, which is more outgoing and wishes to protect the rights of individuals across the globe while securing Columbia's position as the architect of this new democratic world order.\nWallis Bonnet of the FDP, Mayor of Max D.C., wishes to strengthen the internal structure of the state and give the army a fixed budget, wishing to slowly turn the militias into regular line infantry.\nSimeon Mercer of the LA, businessman and founding member of the Columbean Peace Association, has suggested the formation of a global alliance.\n\nThen there is Timothy Callahan. Not one of the gentlemen and never invited, but his Social Democrats have put forward unacceptable suggestions for the state to interfere and enforce stronger labour laws. Preposterous!\nEven more preposterous is the fact that his party has won a landslide victory, enough to rival Mark Max. Of course they wouldn't dare to upset the balance of power... but what if they did?\nWhat will the Social Democrats and Callahan choose as the future for Columbians everywhere?"
 CLM_election.1.a:0 "A large coalition consisting of the Social Democrats and the Gentlemen..."
 CLM_election.1.b:0 "No compromises! Callahan is our Rising Star!"
 CLM_election.2.t:0 "Preparations"
 CLM_election.2.d:0 "While we, fortunately, always had more than a single party in Columbia due to the fact that the very first government had been formed by military personnel and small business owners, never before have so many parties signed up to run for Vice President. Due to the number of parties no single party can gain a majority, but this merely ensures that compromises must be made and that no single faction gains too much power, at least in theory.\n\nIn the center of it all we have the three so-called gentlemen:\nThe National Party has traditionally always been very pro military due to its origins in the revolutionary war. Most of its members are current or former officers in the armed forces, but there are also some larger business owners who see in the NP someone who shares their interests in expanding Columbian business abroad. This year they are led by Richard Grants, the son of Admiral Joseph Grants of the Columbian Navy. His agenda sees the expansion of Columbian military technology to a modern standard and tackling the severe lack of equipment.\nThe Federal Democratic Party was the other founding faction during the revolutionary war. While it used to be the overall larger party and just an everybody party, developments quickly led to a split between the pro-state and pro-government FDP that seeks to strengthen Columbia domestically and the Liberal Alliance, which is more outgoing and wishes to protect the rights of individuals across the globe while securing Columbia's position as the architect of this new democratic world order.\nWallis Bonnet of the FDP, Mayor of Max D.C., wishes to strengthen the internal structure of the state and give the army a fixed budget, wishing to slowly turn the militias into regular line infantry.\nSimeon Mercer of the LA, businessman and founding member of the Columbean Peace Association, has suggested the formation of a global alliance.\n\nThen there is Timothy Callahan. Not one of the gentlemen and never invited, but his Social Democrats have put forward unacceptable suggestions for the state to interfere and enforce stronger labour laws. Preposterous!\nBut we might copy a thing or two of his agenda...\n\nFinally, there are the Corporations of Columbia. It has not gone unnoticed that they have been watching the past few elections with great interest and it is likely that, if we decide to let them interfere and sponsor candidates, they might get enough votes to force a government coalition in their favour."
 CLM_election.2.a:0 "We trust in the three gentlemen."
 CLM_election.2.b:0 "State interference is not allowed. Let the Corpos do as they please!"
 CLM_election.3.t:0 "The three gentlemen"
 CLM_election.3.d:0 "The three gentlemen have come together to discuss the new coalition. While compromises can be made, only one can become the next Vice President and thus the main catalyst for the reforms in this election cycle.\n\nThe Vice President for this term is...."
 CLM_election.3.a:0 "Richard Grants (NP)"
 CLM_election.3.b:0 "Wallis Bonnet (FDP)"
 CLM_election.3.c:0 "Simeon Mercer (LA)"
 CLM_election.3.d:0 "A large coalition including the Social Democrats..."
 CLM_election.4.t:0 "The interests of the Corporations"
 CLM_election.4.d:0 "Through massive media efforts and sponsored tours throughout all of Columbia in the election campaign, the industrialists and large business owners managed to get enough of the votes to elect not only a Vice President but even replace a large part of the government. The question is whom they wish to sponsor.\n\nAlexander Brook, one of five sons in the Brook Business Family, has always been advocating for less government interference. He may not be the brightest of minds, but this only means that he will listen to the advice of the industrialists. With their support, a strong globalist Columbia is sure to defend business interests and in return bring a flood of capital into the country and the people.\n\nThere is also another, less obvious option.\n\nA small team of scientists and engineers has gathered around Dr. Rutherford, one of the founders of the Trimounts Institute of Technology. Having been a teacher prior to the Revolutionary War, Dr. Rutherford took part in the battle of Babbage and is well respected among his colleagues. He has expressed his interest in keeping Columbia more neutral and turning it into a technological powerhouse. He has also, of his own accord and directly, stated that he is willing to compromise with the industry. After all, technology is for the benefit of all, whether poor beggar or rich business owner."
 CLM_election.4.a:0 "Alexander Brook will serve the interest of Columbia and the big players who keep the country running well."
 CLM_election.4.b:0 "Dr. Rutherford has some interesting ideas. Give him a chance!"
 CLM_election.5.t:0 "A star in the night"
 CLM_election.5.d:0 "Placeholder text for this event."
 CLM_election.5.a:0 "Callahan! Callahan! Callahan!"
 CLM_election.6.t:0 "The election of 1029"
 CLM_election.6.d:0 "The long awaited election of 1029 is upon us. While we've had elections before, none have had as many contenders, let alone so many who have an actual shot at winning. While most in government seem happy about our fledgling democracy seemingly being a success, some voice concerns about what would happen if a party was elected that intended to abolish the very same democracy that helped them get into power. Mark Max also seems to be thinking, or rather calculating, something beyond our comprehension.\n\nOf course it would be easy for you, Mr. Vice President, to gently nudge the elections in the right direction, at your discretion of course. Maylander is always available to lend his support."
 CLM_election.6.a:0 "We shall not interfere in this matter."
 CLM_election.6.b:0 "We must not allow this opportunity to go to waste."
 CLM_election.7.t:0 "The Election of 1033"
 CLM_election.7.d:0 "Placeholder text for this event."
 CLM_election.7.a:0 "So be it."
