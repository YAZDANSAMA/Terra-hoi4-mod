l_english:
 # Native diplomatic decisions, reasoned replies, and readable memories.
 terra_diplomatic_desk:0 "The Diplomatic Desk"
 terra_diplomatic_desk_desc:0 "Every government remembers how it has been treated. Send envoys, acknowledge old disputes, test practical cooperation, or negotiate mutual restraint. Replies reflect the other government's interests, character, trust, grievances, and domestic pressures. A polite refusal does not create an enemy; promises broken later are remembered. The diplomatic brief explains their current position before you spend political capital."
 terra_read_diplomatic_position:0 "Read [FROM.GetName]'s position"
 terra_read_diplomatic_position_desc:0 "Ask our diplomatic service for an assessment of [FROM.GetName]. The brief distinguishes their trust, unresolved territorial disputes, conflicting blocs, domestic pressure, and willingness to cooperate. It describes a current assessment, not a guarantee of their next choice."
 terra_send_envoy:0 "Open a channel with [FROM.GetName]"
 terra_send_envoy_desc:0 "Send an envoy without an ultimatum. A receptive government may open regular channels; a cautious one may agree only to limited talks. Neither response creates an alliance. Replies arrive after three days."
 terra_rebuild_confidence:0 "Rebuild confidence with [FROM.GetName]"
 terra_rebuild_confidence_desc:0 "Acknowledge past disputes and offer a credible path back to normal relations. Acceptance reduces grievances and builds trust, but does not erase a history of betrayal in one meeting. Territorial claims and current strategic interests still matter."
 terra_offer_cooperation:0 "Propose cooperation with [FROM.GetName]"
 terra_offer_cooperation_desc:0 "Propose a working relationship on trade and diplomatic coordination. They can accept, suggest a smaller pilot, or decline with a reason. The agreement improves goodwill and foreign-policy preferences; it does not transfer resources, factories, or faction membership."
 terra_propose_restraint:0 "Negotiate restraint with [FROM.GetName]"
 terra_propose_restraint_desc:0 "Offer reciprocal restraint between sovereign governments outside the same faction. Full acceptance creates a real non-aggression pact under the normal game rules. A guarded reply opens dialogue without signing a pact. Existing wars, subject status, or incompatible blocs prevent a signature."
 terra_dip_envoy_available_tt:0 "Our diplomatic service can handle another approach (seven days between outbound requests)."
 terra_dip_request_sent_tt:0 "An envoy departs. A reply is expected in three days. If sovereignty, war, or treaty circumstances invalidate the approach before delivery, the political-power cost is returned."
 terra_dip_valid_talks_tt:0 "Both governments remain sovereign, active, and at peace with one another."
 terra_dip_full_cooperation_tt:0 "Builds bilateral trust and goodwill for one year. No faction membership or material transfers are included."
 terra_dip_pilot_cooperation_tt:0 "Offers limited cooperation. The other government must agree before modest trust and goodwill are added."
 terra_dip_restraint_signed_tt:0 "Creates a real reciprocal non-aggression pact. Normal game rules govern its cancellation and duration."
 terra_dip_guarded_talks_tt:0 "Opens limited channels. No non-aggression pact is signed."
 terra_dip_history_remains_tt:0 "Improves trust and reduces grievances gradually. Old betrayals and territorial disputes are not erased automatically."
 terra_talks.2.a:0 "Welcome the envoy. Let us talk seriously."
 terra_talks.2.b:0 "A limited channel, with no promises."
 terra_talks.2.c:0 "Decline respectfully and state our concern."
 terra_talks.2.withdraw:0 "Circumstances have changed. Recall the proposal."
 terra_talks.2.t:0 "An envoy from [FROM.GetName]"
 terra_talks.2.dbetrayal:0 "[FROM.GetName] asks to reopen regular diplomatic channels. Our officials remember serious injuries and the losses that followed. Talking could serve our interests, but a polite letter is not evidence of reliability. We can hear them out without committing ourselves."
 terra_talks.2.dclaims:0 "[FROM.GetName] proposes regular diplomatic contact. There is an unresolved territorial dispute between us. An open channel could help contain it, but their approach contains no settlement and asks us to trust a government with competing interests."
 terra_talks.2.dpressure:0 "An envoy from [FROM.GetName] proposes regular talks. Our government is under considerable domestic or wartime pressure. Reliable contacts could reduce uncertainty, but we have little capacity for ambitious commitments."
 terra_talks.2.dwelcome:0 "[FROM.GetName] wants a regular channel between our governments. Our diplomats see enough common ground to make the offer useful. We can welcome the envoy, keep the conversation narrowly practical, or explain that the timing is wrong."
 terra_talks.2.d:0 "[FROM.GetName] has sent an envoy asking for regular diplomatic contact. This is an opening rather than a treaty. Our answer should reflect what we stand to gain, the risks of trusting them, and the limits we want them to understand."
 terra_talks.3.a:0 "Keep the channel useful."
 terra_talks.3.t:0 "[FROM.GetName] opens the door"
 terra_talks.3.d:0 "Our envoy was received by [FROM.GetName] and returned with an invitation to regular talks. They are willing to treat us as a serious interlocutor. A small foundation of mutual trust has been established; deeper cooperation will still need to earn its place."
 terra_talks.4.a:0 "Trust can start with small steps."
 terra_talks.4.t:0 "A guarded answer from [FROM.GetName]"
 terra_talks.4.d:0 "[FROM.GetName] will speak with us, but only through a limited channel. Their answer carefully avoids a pledge of support. Our diplomats advise respecting those boundaries and demonstrating reliability before asking for more."
 terra_talks.11.a:0 "Accept a measured reconciliation."
 terra_talks.11.b:0 "We will hear them out. Forgiveness must wait."
 terra_talks.11.c:0 "Explain why we are not ready."
 terra_talks.11.withdraw:0 "Circumstances have changed. Recall the proposal."
 terra_talks.11.t:0 "[FROM.GetName] asks to rebuild confidence"
 terra_talks.11.dbetrayal:0 "[FROM.GetName] acknowledges that our relationship has suffered and asks for a way back. The wounds are serious. We can accept a measured reconciliation, hear them out without forgiving the past, or say that deeds must precede another promise. One meeting will not erase what happened."
 terra_talks.11.dclaims:0 "[FROM.GetName] proposes a reconciliation, but the map still contains a dispute between us. We can improve the tone without renouncing a claim. A lasting settlement would need more than diplomatic courtesy."
 terra_talks.11.d:0 "[FROM.GetName] offers an acknowledgement of past disputes and proposes restoring working relations. Their diplomats ask for a fair hearing rather than instant forgiveness. We must decide whether improving the relationship is useful and whether their approach is credible."
 terra_talks.12.a:0 "Make the next promise one we can keep."
 terra_talks.12.t:0 "A path back with [FROM.GetName]"
 terra_talks.12.d:0 "[FROM.GetName] accepts a measured reconciliation. Both diplomatic services will try to restore a more reliable working relationship. Grievances have eased and trust has improved, but older injuries and unresolved territorial interests have not simply disappeared."
 terra_talks.13.a:0 "Let our actions carry the next message."
 terra_talks.13.t:0 "[FROM.GetName] asks for evidence"
 terra_talks.13.d:0 "[FROM.GetName] has agreed to renewed talks while withholding full reconciliation. Their response is deliberate: they want consistent behaviour before treating us as a dependable partner. A little tension has eased, but the difficult work remains."
 terra_talks.21.a:0 "Accept. There is value in working together."
 terra_talks.21.b:0 "Offer a smaller pilot, subject to their agreement."
 terra_talks.21.c:0 "Decline and give a clear reason."
 terra_talks.21.withdraw:0 "Circumstances have changed. Recall the proposal."
 terra_talks.21.t:0 "An offer of cooperation from [FROM.GetName]"
 terra_talks.21.dbetrayal:0 "[FROM.GetName] proposes a working relationship on trade and diplomatic coordination. Our officials remember a serious breach of trust. Even if there is a practical benefit, a broad agreement may ask more confidence of us than their record justifies. A small pilot is available as an alternative."
 terra_talks.21.dclaims:0 "[FROM.GetName] asks to cooperate on practical economic and diplomatic questions. An unresolved territorial dispute still divides us. Cooperation could be limited to useful common ground without settling the dispute; we are equally free to decline."
 terra_talks.21.dpressure:0 "[FROM.GetName] proposes closer coordination. Our government is stretched, and another commitment could create obligations we cannot sustain. A small pilot would let us test the value of the relationship before promising more."
 terra_talks.21.dinterest:0 "[FROM.GetName] proposes practical cooperation on trade and diplomatic coordination. Our governments have a reason to work together beyond sentiment: there is common strategic or economic ground. The proposal creates goodwill and a preference for cooperation, with no automatic alliance or transfer of resources."
 terra_talks.21.d:0 "[FROM.GetName] has offered a practical working relationship on trade and diplomatic coordination. We can accept the broad approach, return a smaller pilot proposal, or explain why cooperation does not presently suit our interests. Sovereignty and faction membership are unaffected."
 terra_talks.22.a:0 "Build on results, not declarations."
 terra_talks.22.t:0 "Cooperation agreed with [FROM.GetName]"
 terra_talks.22.d:0 "[FROM.GetName] accepts the proposal for practical cooperation. Our diplomatic services now have a stronger basis for economic contact and foreign-policy coordination. This is a working relationship, not a promise to enter every war or join the same faction."
 terra_talks.23.a:0 "Accept the pilot. Let results speak."
 terra_talks.23.b:0 "Decline the pilot without an insult."
 terra_talks.23.withdraw:0 "The circumstances no longer permit the pilot."
 terra_talks.23.t:0 "[FROM.GetName] proposes a smaller first step"
 terra_talks.23.d:0 "[FROM.GetName] has returned a counterproposal: a limited pilot instead of a broad partnership. Their government wants to test whether cooperation produces a real benefit before committing more trust. We may accept this smaller arrangement or politely leave matters where they stand. There is no additional political-power charge."
 terra_talks.25.a:0 "Keep expectations realistic."
 terra_talks.25.t:0 "[FROM.GetName] accepts the pilot"
 terra_talks.25.d:0 "[FROM.GetName] agrees to begin with the smaller arrangement we proposed. Both governments can now test the relationship on practical questions. Modest goodwill and trust have been established without promising a broad alliance."
 terra_talks.26.a:0 "We understand their position."
 terra_talks.26.t:0 "[FROM.GetName] declines the pilot"
 terra_talks.26.d:0 "[FROM.GetName] has respectfully declined our smaller cooperation proposal. Neither side has undertaken a new commitment, and the reply contains no insult. We retain the freedom to revisit relations when circumstances change."
 terra_talks.27.a:0 "Close this exchange for now."
 terra_talks.27.t:0 "The pilot is overtaken by events"
 terra_talks.27.d:0 "[FROM.GetName] can no longer pursue the proposed pilot. War, sovereignty, or the survival of one government has changed since the exchange began. No agreement has been imposed and no new commitment exists."
 terra_talks.31.a:0 "Sign the pact and make restraint reciprocal."
 terra_talks.31.b:0 "Talk, but do not sign a pact."
 terra_talks.31.c:0 "Explain why a pact is unacceptable."
 terra_talks.31.withdraw:0 "Circumstances have changed. Recall the proposal."
 terra_talks.31.t:0 "[FROM.GetName] proposes reciprocal restraint"
 terra_talks.31.dclaims:0 "[FROM.GetName] offers a non-aggression pact. There is still an unresolved territorial dispute between us. A signature would place a real limit on military action under normal game rules without settling that dispute. We can refuse, or agree only to diplomatic contact."
 terra_talks.31.dbetrayal:0 "[FROM.GetName] asks us to sign a non-aggression pact. Our officials remember a serious failure of trust. A pact would create an actual commitment; a limited channel would let us talk without relying on another promise."
 terra_talks.31.dpressure:0 "[FROM.GetName] proposes a non-aggression pact. Relief from uncertainty on this front could serve a government already under pressure. We must weigh that relief against the risk of trusting their intentions."
 terra_talks.31.d:0 "[FROM.GetName] proposes reciprocal restraint through a non-aggression pact. Both countries must remain sovereign, at peace with one another, and outside incompatible blocs. We can sign a real pact, offer only a limited channel, or refuse with our reasons. The offer does not settle territorial claims."
 terra_talks.32.a:0 "Treat the signature as a commitment."
 terra_talks.32.t:0 "A pact with [FROM.GetName]"
 terra_talks.32.d:0 "[FROM.GetName] has signed the reciprocal non-aggression pact. A real treaty now exists under normal game rules. Confidence has improved, but it remains our responsibility to honour the commitment; breaking it later carries diplomatic consequences."
 terra_talks.33.a:0 "Continue carefully."
 terra_talks.33.t:0 "[FROM.GetName] will talk, but will not sign"
 terra_talks.33.d:0 "[FROM.GetName] has declined a binding pact while agreeing to limited diplomatic contact. This modest opening eases some tension. No non-aggression pact has been created, and neither government has promised military restraint."
 terra_dip_profile_pragmatic_tt:0 "Pragmatic government: concrete security and economic gains weigh more heavily than flattering language."
 terra_dip_profile_imperial_tt:0 "Imperial government: prestige, autonomy, and freedom of action matter; promises that limit ambition face a higher bar."
 terra_dip_profile_guardian_tt:0 "Guardian government: sovereignty and the security of its people matter; credible restraint can be attractive."
 terra_dip_profile_mercantile_tt:0 "Mercantile government: practical trade and reliable working relationships are valuable, but unstable commitments are costly."
 terra_dip_profile_cautious_tt:0 "Cautious government: prefers small tests and limited commitments before placing substantial trust in a partner."
 terra_dip_profile_idealist_tt:0 "Idealist government: receptive to reconciliation and credible shared principles, while still considering its security interests."
 terra_dip_brief_limits_tt:0 "This is the other government's current assessment of us. Weekly strategic assessments may lag recent exchanges. Trust and grievances change immediately; a government can still make a different choice when interests or circumstances change."
 terra_talks.41.a:0 "Keep this assessment in mind."
 terra_talks.41.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.41.d:0 "[FROM.GetName] currently sees a useful partner in us. Their assessment is receptive and they carry no overriding grievance that closes the door. A concrete cooperation proposal has a better basis than an empty declaration. Reliability still matters, and the government is not promising to support every action we take."
 terra_talks.42.a:0 "Keep this assessment in mind."
 terra_talks.42.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.42.d:0 "[FROM.GetName] remembers a serious betrayal or accumulated injury associated with us. Their diplomats may hear an envoy, but a broad agreement or binding pact is unlikely to be trusted. Reconciliation must be gradual; one courteous message will not remove the memory of what happened."
 terra_talks.43.a:0 "Keep this assessment in mind."
 terra_talks.43.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.43.d:0 "There is an unresolved territorial dispute between us and [FROM.GetName]. One government owns territory the other regards as its core. They may still see value in limited talks, but no diplomatic gesture silently renounces these interests. The dispute makes broad cooperation and restraint harder to sell."
 terra_talks.44.a:0 "Keep this assessment in mind."
 terra_talks.44.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.44.d:0 "[FROM.GetName] is under substantial domestic or wartime pressure. Its government has limited capacity for new commitments. Relief from uncertainty can be useful, but practical, modest proposals fit its circumstances better than ambitious promises. Pressure is a concern, not an automatic refusal."
 terra_talks.45.a:0 "Keep this assessment in mind."
 terra_talks.45.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.45.d:0 "We and [FROM.GetName] belong to different factions. Their government must consider the loyalties and risks of its own bloc. Limited diplomatic contact remains possible, but a separate non-aggression pact is unavailable while these bloc commitments conflict."
 terra_talks.46.a:0 "Keep this assessment in mind."
 terra_talks.46.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.46.d:0 "We are at war with [FROM.GetName]. The diplomatic desk does not impose a peace or force either side to surrender. An envoy, cooperation proposal, or peacetime restraint pact is unavailable during this bilateral war. The standard peace and war systems remain in control."
 terra_talks.47.a:0 "Keep this assessment in mind."
 terra_talks.47.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.47.d:0 "[FROM.GetName] has no clear reason to place substantial trust in us yet. They may be neutral, guarded, or dissatisfied without a single dominant dispute. An envoy is the most modest test of their willingness to talk. The outcome will depend on their character, current pressures, and whether our offer creates a credible benefit."
 terra_talks.48.a:0 "Keep this assessment in mind."
 terra_talks.48.t:0 "Diplomatic brief: [FROM.GetName]"
 terra_talks.48.d:0 "[FROM.GetName] has a practical reason to work with us: existing cooperation, shared security concerns, or useful neighbouring commercial ties. That interest does not mean unrestricted trust. A limited pilot may be a credible first step if the relationship is still uncertain."
 terra_talks.60.a:0 "Wait for a more suitable moment."
 terra_talks.60.t:0 "A diplomatic approach is withdrawn"
 terra_talks.60.d:0 "The situation changed before the proposal could be completed. War, sovereignty, an existing pact, faction commitments, or the survival of a government now prevents the original approach. No agreement has been imposed. If we paid for this outbound request, its political-power cost has been returned."
 terra_talks.61.a:0 "Wait for a more suitable moment."
 terra_talks.61.t:0 "A diplomatic approach is withdrawn"
 terra_talks.61.d:0 "The situation changed before the proposal could be completed. War, sovereignty, an existing pact, faction commitments, or the survival of a government now prevents the original approach. No agreement has been imposed. If we paid for this outbound request, its political-power cost has been returned."
 terra_talks.62.a:0 "Wait for a more suitable moment."
 terra_talks.62.t:0 "A diplomatic approach is withdrawn"
 terra_talks.62.d:0 "The situation changed before the proposal could be completed. War, sovereignty, an existing pact, faction commitments, or the survival of a government now prevents the original approach. No agreement has been imposed. If we paid for this outbound request, its political-power cost has been returned."
 terra_talks.63.a:0 "Wait for a more suitable moment."
 terra_talks.63.t:0 "A diplomatic approach is withdrawn"
 terra_talks.63.d:0 "The situation changed before the proposal could be completed. War, sovereignty, an existing pact, faction commitments, or the survival of a government now prevents the original approach. No agreement has been imposed. If we paid for this outbound request, its political-power cost has been returned."
 terra_talks.70.a:0 "Respect the answer and reassess our approach."
 terra_talks.70.t:0 "[FROM.GetName] declines with reasons"
 terra_talks.70.d:0 "[FROM.GetName] declines our proposal because the relationship still carries a serious breach of trust or accumulated injury. Their response is firm: another promise does not outweigh the memory of what happened. A smaller opening or a gradual reconciliation may be more credible later."
 terra_talks.71.a:0 "Respect the answer and reassess our approach."
 terra_talks.71.t:0 "[FROM.GetName] declines with reasons"
 terra_talks.71.d:0 "[FROM.GetName] declines our proposal while pointing to unresolved territorial interests. The government is unwilling to treat courtesy as a settlement of that dispute. Its reply leaves the door open to communication but offers no new commitment."
 terra_talks.72.a:0 "Respect the answer and reassess our approach."
 terra_talks.72.t:0 "[FROM.GetName] declines with reasons"
 terra_talks.72.d:0 "[FROM.GetName] declines on strategic grounds. Conflicting faction obligations or active war goals make our proposal difficult to reconcile with their current policy. A signature would promise more than their government is prepared to honour."
 terra_talks.73.a:0 "Respect the answer and reassess our approach."
 terra_talks.73.t:0 "[FROM.GetName] declines with reasons"
 terra_talks.73.d:0 "[FROM.GetName] declines while emphasizing the pressures on its government. Its officials say that a new commitment cannot be sustained at present. The answer reflects their current capacity as well as their assessment of the relationship."
 terra_talks.74.a:0 "Respect the answer and reassess our approach."
 terra_talks.74.t:0 "[FROM.GetName] declines with reasons"
 terra_talks.74.d:0 "[FROM.GetName] has considered the proposal and does not see enough benefit or confidence to accept it now. Their government prefers to retain its freedom of action. The refusal is diplomatic rather than an insult; no extra grievance has been created simply because they said no."
 terra_dip_open_channels:0 "Open Diplomatic Channels"
