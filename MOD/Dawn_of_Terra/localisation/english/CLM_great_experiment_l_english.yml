 CLM_the_great_experiment_desc_text:0 "Columbia has been viewed by many to be merely a great experiment that will eventually fail and see Columbia revert to a despotic state, whether under a monarch or a dictator. We however have other plans. Under Mark Max' wise guidance we have layed the groundwork for a great state, a nation with the purpose of serving its people, a government run by the people for the people. We strive to accomplish what no nation has done before, true freedom. We strive for the Columbian Dream.

This, however, does not change the fact that we have so far been completely reliant on President Max, all the way from the Revolutionary War up until now. It also does not change the reality that he is unlikely to go away, being one of the most popular rulers Terra has ever seen, even without a massive propaganda apparatus. They say that the line between genius and madman is thin, and we know that our democracy is still in its infancy and a fickle flame in danger of being snuffed out at any moment. The upcoming elections, the first truly nationwide elections and the first ones since the establishment of the capital city of columbia, will surely determine the fate of not only millions of citizens but of Terra itself. Hail, Columbia!"
