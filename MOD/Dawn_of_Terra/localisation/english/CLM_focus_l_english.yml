 CLM_a_standing_army_desc:0 " "
 CLM_tackling_the_army_problem:0 "Tackling the Army Problem"
 CLM_tackling_the_army_problem_desc:0 "The Columbian Army can hardly be called a real army. Made up mainly of militiamen who fought in the Revolutionary War, they rely on old equipment, obsolete tactics and a purely defensive stance. If we want to change that, we must start here."
