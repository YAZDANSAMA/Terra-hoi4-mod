l_english:
 CLM_manifest_destiny:0 "Manifest Destiny"
 CLM_manifest_destiny_desc:0 "The figures are placed on the board. Time to cast the die."
 CLM_a_country_for_you:0 "A country for you!"
 CLM_a_country_for_you_desc:0 "A Columbia that is for everybody, for you and me."
 CLM_the_long_road_ahead:0 "The long Road Ahead"
 CLM_the_long_road_ahead_desc:0 "It is time for us to walk the road to a greater Columbia."
 CLM_a_country_for_me:0 "A country for me..."
 CLM_a_country_for_me_desc:0 "A Columbia that is for everybody, but more for some than others."
 CLM_discuss_expansion_projects:0 "Discuss Expansion Projects"
 CLM_discuss_expansion_projects_desc:0 "We will convene a meeting and discuss possible expansion paths and the necessary steps to accomplish our goals."
 CLM_conduct_aerial_recon:0 "Conduct Aerial Recon"
 CLM_conduct_aerial_recon_desc:0 "Prospecting and mapping take time. Our brightest minds have come up with an innovative solution!"
 CLM_prepare_the_industry:0 "Prepare the Industry"
 CLM_prepare_the_industry_desc:0 "For our planned expansion, we must first ensure that our core industry can support these brave pioneers with the necessary supplies and construction materials."
 CLM_set_aside_funds:0 "Set aside Funds"
 CLM_set_aside_funds_desc:0 "While our expansion projects are a costly endeavour, we don't have to pay everything immediately. Time will tell if it will be worth it in the end. Well, so does Max, but what does he know?"
 CLM_prepare_supply_roads:0 "Prepare Supply Roads"
 CLM_prepare_supply_roads_desc:0 "We must close the gaps inside our supply network to allow a push into the north and south."
 CLM_net_agricultural_surplus:0 "Net Agricultural Surplus"
 CLM_net_agricultural_surplus_desc:0 "As hard as it may be, we must try to set aside some produce to use in the establishment of frontier colonies. Mark Max will personally oversee production numbers and give financial incentives."
 CLM_a_thorough_population_census:0 "A thorough Population Census"
 CLM_a_thorough_population_census_desc:0 "To calculate our further steps, we have to know how many people live inside Columbia. While we have a good idea of our large cities, there are always a few slums in the cities or villages in the vast forests that may hide people, people that can be taxed."
 CLM_into_tl_l_c_ns_jungles:0 "Into Tlālōcān's Jungles"
 CLM_into_tl_l_c_ns_jungles_desc:0 "There are stories that claim that the jungles of Tlālōcān are cursed by an evil spirit. Too bad that there will be no more room for evil spirits once our industrialisation scheme is completed."
 CLM_encourage_colonial_migration:0 "Encourage Colonial Migration"
 CLM_encourage_colonial_migration_desc:0 "There are many in Columbia that can be relocated. Whether by promises of adventure, positions of power or just a quiet and peaceful life, we will nudge them gently into leaving for this new frontier."
 CLM_reinforce_the_border_against_sargon:0 "Reinforce the Border against Sargon"
 CLM_reinforce_the_border_against_sargon_desc:0 "While Sargon may not be an active threat right now, we will nonetheless have to reinforce the border to ensure our claims to these vast jungles."
 CLM_kickstart_a_basic_industry:0 "Kickstart a basic Industry"
 CLM_kickstart_a_basic_industry_desc:0 "Finally, we must ensure that the locals are able to support not only their survival but also their continued growth, even without support from the central government."
 CLM_welcome_lucky_into_the_fold:0 "Welcome Lucky into the fold"
 CLM_welcome_lucky_into_the_fold_desc:0 "Welcome the state of Lucky, our newest member, into Columbia!\n\n§GUnlocks the state of Lucky on the electoral map.§!"
 CLM_into_the_vast_yukon:0 "Into the vast Yukon"
 CLM_into_the_vast_yukon_desc:0 "While the northern deserts are useless to us, the same cannot be said about our access to the sea. As we are effectively landlocked, President Max has decreed that the Yukon is a priority for our shipbuilding industry."
 CLM_the_riches_of_the_seas:0 "The riches of the seas"
 CLM_the_riches_of_the_seas_desc:0 "Prospecting suggests that there may be yet undiscovered resources in the sea. Beneath the sea, to be precise. Getting there may be hard, but it is surely a worthwhile effort."
 CLM_establish_the_columbian_shipyards:0 "Establish the Columbian Shipyards"
 CLM_establish_the_columbian_shipyards_desc:0 "First, we will establish a new shipbuilding sector in the north. Once demand is born, production shall follow."
 CLM_reinforce_yukons_position:0 "Reinforce Yukon's position"
 CLM_reinforce_yukons_position_desc:0 "The cogs creak, the pistons pound, and thousands and thousands of dockworkers from the north hum, as we welcome them to join Columbia!\n\n§GUnlocks the state of Columbian Yukon on the electoral map.§!"
 CLM_steel_for_the_iron_beasts:0 "Steel for the iron beasts"
 CLM_steel_for_the_iron_beasts_desc:0 "Our furnaces demand steel; our industry must grow. To support our shipbuilding industry, we will source local iron ore and smelt it in local steel mills. Jobs for everyone!"
 CLM_roadbuilding_in_the_marshes:0 "Roadbuilding in the Marshes"
 CLM_roadbuilding_in_the_marshes_desc:0 "A few drained marshes, a few reinforced roads. That is the cost of accessing a region with fertile soil."
 CLM_introduce_more_livestock:0 "Introduce more Livestock"
 CLM_introduce_more_livestock_desc:0 "There are many animals roaming around Columbia, some more beneficial than others. We will charter large populations and start a campaign to domesticate and distribute the best of the best."
 CLM_subsidise_farmers:0 "Subsidise Farmers"
 CLM_subsidise_farmers_desc:0 "Farmers are inefficient. Machines are not. A simple problem with a simple fix. Of course, the machines may not be freely distributed by the state... but we could buy too many by accident and resell them for lower prices."
 CLM_an_agricultural_paradise:0 "An agricultural paradise"
 CLM_an_agricultural_paradise_desc:0 "What was once marsh is now the breadbasket of Columbia."
 CLM_massaran_bread_columbian_freedom:0 "Massaran bread, Columbian freedom"
 CLM_massaran_bread_columbian_freedom_desc:0 "Alas, her lands are ripe, tended to by thousands of young men and women, toiling for a better future for all Columbians. Hail them with open arms! Hail, Columbia!\n\n§GUnlocks the state of Massara on the electoral map.§!"
 CLM_gold_gold_gold:0 "Gold! Gold! Gold!"
 CLM_gold_gold_gold_desc:0 "We have struck gold! W-wait, why is it moving?"
 CLM_land_reclamation:0 "Land reclamation"
 CLM_land_reclamation_desc:0 "As it turns out, these mountains are more welcoming than we had first thought. A lot of habitable land has been claimed and set up to welcome more miners."
 CLM_prospect_oreon_for_ores:0 "Prospect Oreon for Ores"
 CLM_prospect_oreon_for_ores_desc:0 "Mark Max predicted large ore deposits beneath the mountains and hills of Oreon. Let's put his calculations to the test, and build houses for the workers while we are at it."
 CLM_mining_industry:0 "Mining industry"
 CLM_mining_industry_desc:0 "\"I am a Durin and I am digging a hole, diggy diggy hole.\""
 CLM_the_forge_of_democracy:0 "The Forge of Democracy"
 CLM_the_forge_of_democracy_desc:0 "Oreon has become an integral part of supplying our industries. The workers have paid the price of their freedom with their sweat and blood. Time to welcome them.\n\n§GUnlocks the state of Oreon on the electoral map.§!"
 CLM_crossing_calirinia:0 "Crossing Calirinia"
 CLM_crossing_calirinia_desc:0 "Calirinia is in a prime position to develop a thriving heavy industry, given its proximity to the ports of Yukon and the industry of our Columbian heartlands."
 CLM_columbian_metal:0 "Columbian Metal"
 CLM_columbian_metal_desc:0 "Fresh steel from Oreon, worked by engineers from Illion in the heavy industry of Calirinia, then shipped to the ports of Yukon. Beasts of steel, made in Columbia.\n\n§GUnlocks the state of Calirinia on the electoral map.§!"
 CLM_columbian_carworks:0 "Columbian Carworks"
 CLM_columbian_carworks_desc:0 "Cars are very expensive and way out of reach for the ordinary Columbian citizen. Max has come up with an ingenious economic scheme: A saving plan with a relatively small weekly payment directly into the newly founded Columbian Car & Foundry fund. The money will then be used to produce the cars, creating jobs and leaving us with more industrial capacity once the factories have served their purpose. With a few propaganda campaigns to ensure enough savers, we can just drop this idea into the shark tank like chum and watch as our capitalists take advantage of it."
 CLM_declaration_of_independence:0 "Declaration of Independence"
 CLM_declaration_of_independence_desc:0 " "
 CLM_allocate_special_resources_to_maylander:0 "Allocate special resources to Maylander"
 CLM_allocate_special_resources_to_maylander_desc:0 "Mark Max has put forth new ideas that will greatly benefit us in the long run. They will go hand in hand with our industrial expansion. Of course, everything needs some capital..."
 CLM_welcome_columbia_to_the_world_stage:0 "Welcome Columbia to the world stage"
 CLM_welcome_columbia_to_the_world_stage_desc:0 " "
 CLM_maintenance_is_not_optional:0 "Maintenance is not optional"
 CLM_maintenance_is_not_optional_desc:0 "While directly subsidising factories is not acceptable, nobody said anything about us sending some maintenance engineers to their factories as inspectors. The fact that they were all trained by us to maintain equipment and ensure smooth operations doesn't matter. Neither does the fact that they freely share what they learned at their workplace with their colleagues from the other workplaces..."
 CLM_the_maylander_foundation:0 "The Maylander Foundation"
 CLM_the_maylander_foundation_desc:0 "The Maylander Foundation is the citizen's best friend. They are a helpful and jolly lot who will spare nothing to help solve our deepest, darkest troubles."
 CLM_the_shadow_section:0 "The Shadow Section"
 CLM_the_shadow_section_desc:0 "Maylander can help in very special ways, in very subtle ways. You didn't know? Good..."
 CLM_framework_capitalism:0 "Framework Capitalism"
 CLM_framework_capitalism_desc:0 "Framework capitalism is the term coined for Columbia's special variant of capitalism. It emphasises establishing frameworks to ensure continued functionality of the system and smooth workings, and then leaves it largely to its own devices, only having the government take on roles that the private sector cannot effectively fulfil itself and act as a third party to help mediate conflicts between competitors."
 CLM_worlds_highest_standard_of_living:0 "WORLD'S HIGHEST STANDARD OF LIVING"
 CLM_worlds_highest_standard_of_living_desc:0 "There's no way like the Columbian way!"
 CLM_we_have_done_it:0 "We have done it!"
 CLM_we_have_done_it_desc:0 " "
 CLM_hail_yan:0 "Hail, Yan!"
 CLM_hail_yan_desc:0 " "
 CLM_the_state_of_the_economy:0 "The state of the economy"
 CLM_the_state_of_the_economy_desc:0 " "
 CLM_hail_columbia:0 "Hail, Columbia!"
 CLM_hail_columbia_desc:0 " "
 CLM_foreign_weapons_expertise:0 "Foreign weapons expertise"
 CLM_foreign_weapons_expertise_desc:0 " "
 CLM_establish_proper_embassies:0 "Establish proper Embassies"
 CLM_establish_proper_embassies_desc:0 " "
 CLM_reach_out_to_the_world:0 "Reach out to the world"
 CLM_reach_out_to_the_world_desc:0 "The time has come for Columbia to set out and greet its neighbours across Terra!"
 CLM_hail_gaul:0 "Hail, Gaul!"
 CLM_hail_gaul_desc:0 "Our friends in Gaul have been a tremendous help in our war for independence. Even still, they are supporting us with crucial goods, intel and even military assistance. It is only natural for us to keep working together with them further down the line!"
 CLM_hail_kazimierz:0 "Hail, Kazimierz"
 CLM_hail_kazimierz_desc:0 "There are a lot of... people in Kazimierz. While they may not have a lot in common with us, they are both the gate to the north and a possible ally against Ursus, should our ambitions ever put us at odds with them."
 CLM_hail_victoria:0 "Hail... Victoria"
 CLM_hail_victoria_desc:0 "Victorians... the same Victorians that put us on a leash and tried to subjugate us when we, naturally, tried to break free. It is these same Victorians that are most likely going to become one of our biggest future rivals. It is also those same Victorians that, according to Max, are likely to prevail over the others.\n\nIt is up to us to decide that we'd rather swallow our pride for the benefit of the Columbians, for it is the victor who writes history, not the just nor the righteous."
 CLM_hail_laterano:0 "Hail, Laterano"
 CLM_hail_laterano_desc:0 " "
 CLM_the_prince_of_death_in_kazdel:0 "The Prince of Death in Kazdel"
 CLM_the_prince_of_death_in_kazdel_desc:0 " "
 CLM_hail_siracusa:0 "Hail, Siracusa"
 CLM_hail_siracusa_desc:0 " "
 CLM_greet_ursus:0 "Greet Ursus..."
 CLM_greet_ursus_desc:0 " "
 CLM_and_our_sami_neighbours_too:0 "...and our Sami Neighbours too"
 CLM_and_our_sami_neighbours_too_desc:0 " "
 CLM_invite_theresa_to_a_banquet:0 "Invite Theresa to a banquet"
 CLM_invite_theresa_to_a_banquet_desc:0 " "
 CLM_exotic_fruits:0 "Exotic Fruits"
 CLM_exotic_fruits_desc:0 "These jungles have proven to contain, besides deadly insects and sicknesses that almost rival Oripathy, some truly delectable and succulent fruits. It would be foolish not to grow them en masse!"
 CLM_vast_riches_in_the_jungle:0 "Vast Riches in the Jungle"
 CLM_vast_riches_in_the_jungle_desc:0 "While traversing the jungle to claim new land for our newly established fruit farms, we came across caoutchouc trees. We could use these to become more autarkic in terms of rubber production, should the need ever arise."
 CLM_kickstart_general_electrics:0 "Kickstart General Electrics"
 CLM_kickstart_general_electrics_desc:0 "Some aspects of life cannot be privatised. The continued supply of adequate energy to the industry and populace is one such aspect. We will write out a contract to our industrialists that is too risky for most to take. Those that dare, mostly small businesses, will then take shared responsibility, leading to the quasi-formation of a new electrical company under the watchful eye of the central government, which will adjust its quotas and contract rewards accordingly."
 CLM_a_capital_fit_for_a_king_without_a_king:0 "A capital fit for a king, without a king"
 CLM_a_capital_fit_for_a_king_without_a_king_desc:0 "Max has devised a plan for a true capital city that will become the bureaucratic and logistical hub of our new Columbia and the center from which our industry will sprawl forth."
 CLM_employ_the_pioneers_for_expeditions:0 "Employ the Pioneers for expeditions"
 CLM_employ_the_pioneers_for_expeditions_desc:0 "With so many expeditions into the jungle, we truly have a vast number of experienced pioneers, most of whom are also battle-hardened veterans of the Revolutionary War. The time has come for us to employ and benefit from them."
 CLM_the_trimounts_institute_of_technology:0 "The Trimounts Institute of Technology"
 CLM_the_trimounts_institute_of_technology_desc:0 "We have done it! With our recent investment, we have set the groundwork to establish a truly modern institute of our own. A modern university with surrounding schools, specialised faculties and, crucially, easy access for the central government to fund researchers directly. Of course, to get our support, the researchers will have to agree to give their patents to us for... safekeeping."
 CLM_ahahahahahaha:0 "Ahahahahahaha!"
 CLM_ahahahahahaha_desc:0 " "
 CLM_fund_researchers:0 "Fund Researchers"
 CLM_fund_researchers_desc:0 "For Max's plan, we will need to find the brightest minds of this age. Finding those skilled individuals will probably take some time off of Max himself, time that could be spent elsewhere."
 CLM_finance_new_tools:0 "Finance new Tools"
 CLM_finance_new_tools_desc:0 "A blacksmith is nothing without his hammer. The same goes for our bright minds. We need computers, boards, calculators, microscopes, incubation chambers, anything. If it exists, surely it will find a use, and with Max being busy, this duty falls to us."
 CLM_columbian_patents:0 "Columbian Patents"
 CLM_columbian_patents_desc:0 "For some people, a patent office may be an intrusion into the market by the state. We are, however, mainly ensuring that each and every company's interests are protected. That may severely limit access to crucial technologies, but there is a solution to that..."
 CLM_expeditions_to_the_frozen_north:0 "Expeditions to the frozen north"
 CLM_expeditions_to_the_frozen_north_desc:0 " "
 CLM_the_engine_of_the_economy:0 "The Engine of the economy"
 CLM_the_engine_of_the_economy_desc:0 "Reclaiming much of the Columbian wilderness will take more than just a few axes and tough men. If we wrote out a few contracts for large agricultural and lumbering machines and some locomotives for transportation, surely a company could be found that would be willing to take out a few loans and form a new industrial sector in our heartlands."
 CLM_modern_cities:0 "Modern Cities"
 CLM_modern_cities_desc:0 "Our housing policy is perfect. The government has a housing fund that gives out contracts to companies reliant on us. These companies form long-term contracts with us with set quotas and upfront payment. They build an equal amount of housing for everyone from lowest income to semi-high, and we rent them for a set price by the contract. The money goes into the fund and is shared generously with our construction industry. We set a floor for housing prices without artificially pumping the housing market too far, and prevent gentrification since the quotas are not solely focused on the low-income households.\n\nIt also helps that we can plan city sections decades into the future, ensuring that no space is wasted."
 CLM_seamless_integration:0 "Seamless Integration"
 CLM_seamless_integration_desc:0 "Let us ensure that expansion of industry, infrastructure and cities is easily achievable, even far into the future."
 CLM_finding_the_ghosts:0 "Finding the Ghosts"
 CLM_finding_the_ghosts_desc:0 "There are many so-called Ghost Numbers: errors regarding data that is either missing or wrong. These Ghost Numbers can cause slight miscalculations that, in the grand scheme of things, lead to significant inefficiencies. We will employ some people to track numbers. Track numbers all day long."
 CLM_final_push_to_industrialisation:0 "Final push to industrialisation"
 CLM_final_push_to_industrialisation_desc:0 "A huge loan for the government, a huge contract for the entire economy.\n\nShould, for some inexplicable reason, a huge demand for industrial goods come from the populace, we will simply sell them the products we purchased via contract for no markup."
 CLM_modern_construction_methods:0 "Modern construction methods"
 CLM_modern_construction_methods_desc:0 "Surely there is a better way to build a house. We will send experts around Terra to find out which way is most fitting for every single one of our climates."
 CLM_time_to_open_up_the_markets:0 "Time to open up the Markets"
 CLM_time_to_open_up_the_markets_desc:0 "The time has come. Release our people into the world, ship our products around the globe. Where others fight to take, we will fight to give, whether they want to consume or not!"
 CLM_the_president_is_watching:0 "The President is watching"
 CLM_the_president_is_watching_desc:0 "As it turns out, removing the Ghost Numbers has an even greater benefit when the decision-maker in your country is actively calculating everything he does. No more uncertainties? At least, not as many as before."
 CLM_the_mighty_columbian_dollar:0 "The mighty Columbian Dollar"
 CLM_the_mighty_columbian_dollar_desc:0 "In our country, the people's voice is what counts. In the outside world, however, it is our money that talks."
 CLM_helicopter_money:0 "Helicopter Money"
 CLM_helicopter_money_desc:0 "President Max is clear about one thing. The industry is ready. To ensure continued growth, we must find another consumer base besides the government. One of our economists has come up with an interesting idea: Just hand money to the people. Of course, such a foolish undertaking would result in inflation and a loss of trust, and may not even have the intended effects if people choose to save their money instead. Mark Max, however, has taken his time to discredit the idea.\n\nPerhaps, just perhaps, he has a point.\n\nA small, regular household dividend for low income households.\n\nCheap, long-term loans and mortgages.\n\nWe really are doing this, aren't we?"
 CLM_warden_of_the_torch:0 "Warden of the Torch"
 CLM_warden_of_the_torch_desc:0 "Beyond where the light shines, Maylander's shadow creeps. Where hushed tones conspire against the people, Maylander listens. Where there is evil, Maylander is not far."
 CLM_the_bane_of_criminals:0 "The bane of Criminals"
 CLM_the_bane_of_criminals_desc:0 "The heroes in the night wear capes, and masks, and cloaks. 'Why?' you ask? Good..."
 CLM_no_research_without_borders:0 "No research without borders"
 CLM_no_research_without_borders_desc:0 " "
 CLM_checks_and_balances:0 "Checks and Balances"
 CLM_checks_and_balances_desc:0 "The time has come for the first real election in modern Columbia."
 CLM_a_nudge_in_the_right_direction:0 "A nudge in the right direction"
 CLM_a_nudge_in_the_right_direction_desc:0 "Vice president! Yes, this room is safe. No, Max will not hear us. Yes, everything is prepared."
 CLM_wallis_bonnet_the_realist_fdp:0 "Wallis Bonnet, the Realist (FDP)"
 CLM_wallis_bonnet_the_realist_fdp_desc:0 " "
 CLM_richard_grants_the_militarist_np:0 "Richard Grants, the Militarist (NP)"
 CLM_richard_grants_the_militarist_np_desc:0 " "
 CLM_alexander_brook_the_corporatist_corp:0 "Alexander Brook, the Corporatist (Corp)"
 CLM_alexander_brook_the_corporatist_corp_desc:0 " "
 CLM_the_social_question_cannot_wait:0 "The Social Question cannot wait"
 CLM_the_social_question_cannot_wait_desc:0 "This historic election must not be wasted by re-electing one of the men that will merely continue the status quo in Columbia. What counts is not Columbia's place in the world, but our place in Columbia. A democracy where elections are predictable and not determined sufficiently by the people is worthless!\n\n§RWarning: this can only be done while the Influence of Max is at -15% or lower.§!"
 CLM_simeon_mercer_the_idealist_la:0 "Simeon Mercer, the Idealist (LA)"
 CLM_simeon_mercer_the_idealist_la_desc:0 " "
 CLM_democratic_cooperation:0 "Democratic Cooperation"
 CLM_democratic_cooperation_desc:0 "Time for us to strengthen our position by entering a coalition with the other democratic parties."
 CLM_no_interference:0 "No interference"
 CLM_no_interference_desc:0 "We shall not interfere in this election. The will of the people shall be heard.\n\nAlso, Max does not seem to like some of the other parties..."
 CLM_let_the_parties_speak:0 "Let the Parties speak"
 CLM_let_the_parties_speak_desc:0 "Welcome to Parliament."
 CLM_pardon_political_exiles:0 "Pardon political exiles"
 CLM_pardon_political_exiles_desc:0 "A true democracy must not decide who gets to speak and who doesn't, even if Max himself claims that these exiles have been cast out for a good reason."
 CLM_timothy_callahan_socdem:0 "Timothy Callahan (SocDem)"
 CLM_timothy_callahan_socdem_desc:0 " "
 CLM_francis_iv_duke_of_lancester_monarch:0 "Francis IV. Duke of Lancester (Monarch)"
 CLM_francis_iv_duke_of_lancester_monarch_desc:0 " "
 CLM_pedro_di_siesta_ethnonat:0 "Pedro di Siesta (EthnoNat.)"
 CLM_pedro_di_siesta_ethnonat_desc:0 " "
 CLM_welcome_the_gentlemen:0 "Welcome the Gentlemen"
 CLM_welcome_the_gentlemen_desc:0 "The center has won a large majority. The time has come for coalition building."
 CLM_a_different_approach:0 "A different approach"
 CLM_a_different_approach_desc:0 "Who gives a hoot about their freedom? Too many souls that would rather see our country's, nay, our people's flame snuffed out. We must take them out first."
 CLM_dr_rutherford_friends_tech:0 "Dr. Rutherford & Friends (Tech)"
 CLM_dr_rutherford_friends_tech_desc:0 " "
 CLM_a_network_of_informants:0 "A Network of Informants"
 CLM_a_network_of_informants_desc:0 "Research Assistant of Professor Fergusson, head of the student faculty for advanced originium materials and someone you can trust. Klaus Hensch, reporting in.\n\n§GUnlocks Klaus Hensch as a political advisor.§!"
 CLM_the_navarch_of_the_seas:0 "The Navarch of the Seas"
 CLM_the_navarch_of_the_seas_desc:0 "The time has come for us to protect our maritime interests. For this, we will need to build a brand new fleet! While we are at it, we might as well get the newest toys available..."
 CLM_port_hamilton_coastal_fort:0 "Port Hamilton Coastal Fort"
 CLM_port_hamilton_coastal_fort_desc:0 "Having a relatively small coastline does have its advantages. One such advantage is the relative ease of protecting it."
 CLM_thermal_and_hydroelectric_energy:0 "Thermal and Hydroelectric Energy"
 CLM_thermal_and_hydroelectric_energy_desc:0 "Siesta, as we have come to call this place, has quite a bit of energy sources due to the volcanic activity and the sheer amount of creeks, rivers and lakes. We should utilise these to develop the region!"
 CLM_king_queen:0 "King & Queen"
 CLM_king_queen_desc:0 " "
 CLM_hounds_of_bolivar:0 "Hounds of Bolivar"
 CLM_hounds_of_bolivar_desc:0 " "
 CLM_a_killing_in_d_c:0 "A Killing in D.C."
 CLM_a_killing_in_d_c_desc:0 "Democracy's strength lies in its lack of reliance on strong leadership. Let's put it to the test by ridding it of all leadership!"
 CLM_a_rising_star:0 "A Rising Star"
 CLM_a_rising_star_desc:0 "It has happened. Everybody thought that Columbia would see the gentlemen and Mark Max rule Columbia forever. Not Timothy Callahan. He rose up like a comet and he is here to stay."
 CLM_letting_the_corpos_interfere:0 "Letting the Corpos Interfere"
 CLM_letting_the_corpos_interfere_desc:0 "It has happened. Seemingly to a surprise to everyone in Columbia but Max himself, the Corporations managed to get a sizeable enough majority for their candidate to shift the government into a new direction."
 CLM_victorian_paramilitaries_to_the_rescue:0 "Victorian Paramilitaries to the rescue!"
 CLM_victorian_paramilitaries_to_the_rescue_desc:0 " "
 CLM_stain_the_experiment_with_blood:0 "Stain the Experiment with Blood"
 CLM_stain_the_experiment_with_blood_desc:0 " "
 CLM_purge_them:0 "Purge them!"
 CLM_purge_them_desc:0 " "
 CLM_fortify_castle_daggerstein:0 "Fortify Castle Daggerstein"
 CLM_fortify_castle_daggerstein_desc:0 " "
 CLM_cooperation_with_the_nationalists:0 "Cooperation with the Nationalists"
 CLM_cooperation_with_the_nationalists_desc:0 "While the Nationalists are surely the most distant from our democratic core, they too care for the betterment of Columbia. And if Mercer's group is not willing to form a coalition easily, we shall step forward as the center party, under conditions of course. For now we can follow their rhetoric and nudge any new immigrants to settle inside the cities where we can better keep an eye on them and integrate them. This may lead to gentrification in the short term, but that is nothing we can't fix later with the help of Mark Max."
 CLM_the_first_vice_president:0 "The First Vice President"
 CLM_the_first_vice_president_desc:0 " "
 CLM_out_with_the_nationalists:0 "Out with the Nationalists"
 CLM_out_with_the_nationalists_desc:0 "The National Party is not one of those other democratic parties. These vile beasts pretending to be protectors of the shining beacon of liberty while secretly trying to undermine the personal freedom of Columbians all around. Time to boot out the filth!"
 CLM_the_blessings_of_the_high_king:0 "The Blessings of the High King"
 CLM_the_blessings_of_the_high_king_desc:0 " "
 CLM_money_is_might:0 "Money is Might"
 CLM_money_is_might_desc:0 " "
 CLM_industrial_cooperation:0 "Industrial Cooperation"
 CLM_industrial_cooperation_desc:0 " "
 CLM_international_peacekeepers:0 "International Peacekeepers"
 CLM_international_peacekeepers_desc:0 " "
 CLM_raid_military_storages:0 "Raid military storages"
 CLM_raid_military_storages_desc:0 "We must act swiftly and decisively. The Columbian militias are weak, their weapons old. A few armed men with stolen military weapons should do the trick. By the time the army returns from the frontier, Columbia will be securely in our hands!"
 CLM_no_need_for_career_politicians:0 "No need for career Politicians"
 CLM_no_need_for_career_politicians_desc:0 " "
 CLM_frontier_exploration:0 "Frontier Exploration"
 CLM_frontier_exploration_desc:0 "There are a lot of sparsely populated, underdeveloped frontier regions that only have weak claims by other nations. As it turns out, this particular place has no claims at all. Not yet, at least!"
 CLM_might_makes_right:0 "Might makes Right"
 CLM_might_makes_right_desc:0 " "
 CLM_arrest_the_gentlemen:0 "Arrest the Gentlemen"
 CLM_arrest_the_gentlemen_desc:0 " "
 CLM_support_labour_unions:0 "Support Labour Unions"
 CLM_support_labour_unions_desc:0 " "
 CLM_friends_in_high_places:0 "Friends in High Places"
 CLM_friends_in_high_places_desc:0 " "
 CLM_raythean_industries:0 "Raythean Industries"
 CLM_raythean_industries_desc:0 " "
 CLM_instructions_unclear:0 "Instructions Unclear"
 CLM_instructions_unclear_desc:0 " "
 CLM_demand_higher_standards_for_officers:0 "Demand higher standards for Officers"
 CLM_demand_higher_standards_for_officers_desc:0 " "
 CLM_a_true_meritocracy:0 "A true Meritocracy"
 CLM_a_true_meritocracy_desc:0 " "
 CLM_tackle_the_army_problem:0 "Tackle the Army Problem"
 CLM_tackle_the_army_problem_desc:0 "Too long have we focused only on the state, completely neglecting the fact that our state needs a standing army to safeguard our freedoms not only domestically but also internationally. With the help of some of the military advisors among the ranks of the Nationalists, we have finally come up with a plan to solve this issue once and for all!"
 CLM_mere_suggestions:0 "Mere Suggestions"
 CLM_mere_suggestions_desc:0 "We have no need to abide laws when we are the ones enforcing them."
 CLM_unexplained_wealth_orders:0 "Unexplained Wealth Orders"
 CLM_unexplained_wealth_orders_desc:0 " "
 CLM_who_exactly_is_vice_president_now:0 "Who exactly is Vice President now?"
 CLM_who_exactly_is_vice_president_now_desc:0 " "
 CLM_trimounts_military_institute:0 "Trimounts Military Institute"
 CLM_trimounts_military_institute_desc:0 "With the financial means gained through the COMITAW we can finally establish a proper military research complex. Grants has decided on a main office in Max D.C. with branches in the other large cities. He has also sponsored the establishment of the Trimounts Military Institute where our new officers can be trained, including a brand new aeronautical institute."
 CLM_a_new_dynasty:0 "A new Dynasty"
 CLM_a_new_dynasty_desc:0 " "
 CLM_the_comitaw:0 "The COMITAW"
 CLM_the_comitaw_desc:0 "The civilian administration may have been competent in their handling of the state and economic recovery after the revolutionary war, but they were completely inept at recovering and raising the army of Columbia. Grants has requested the establishment of the \"Military Committee for Advanced Weapons Research\", COMITAW for short."
 CLM_strong_but_fair:0 "Strong but Fair"
 CLM_strong_but_fair_desc:0 "We have done it! We saved Columbia and we are going to live forever! The army? What about the army?"
 CLM_professor_fergusson:0 "Professor Fergusson"
 CLM_professor_fergusson_desc:0 "Professor Fergusson is here, with a cold and calculating mind and connections to the Trimounts Institute of Technology. He will not leave any spot unchecked."
 CLM_the_columbian_bulldog:0 "The Columbian Bulldog"
 CLM_the_columbian_bulldog_desc:0 "Enrique Dubois, the Columbian Bulldog, is here to kick the men into shape."
 CLM_general_supremo:0 "General Supremo"
 CLM_general_supremo_desc:0 " "
 CLM_enter_kinsmen:0 "Enter Kinsmen"
 CLM_enter_kinsmen_desc:0 " "
 CLM_forced_resettlement:0 "Forced Resettlement"
 CLM_forced_resettlement_desc:0 "Many in our larger cities dislike the poor, stinking masses. Since it just so happens that most of these masses are recently immigrated folk, we have an easier time relocating them with kind words and notes of termination of employment. It's not like they have any friends in the state that can help them, and they have a better use laboring and toiling in the frontier anyway!"
 CLM_setting_the_stones_for_a_league_of_nations:0 "Setting the stones for a League of Nations"
 CLM_setting_the_stones_for_a_league_of_nations_desc:0 "So many Terrans suffer while their leadership bicker amongst themselves. While we may not stop them from being fools, Mercer believes that he can at least set up Columbia's place as a mediator. And who knows, maybe one day these fools too can become as great as we are now."
 CLM_the_league_of_nations:0 "The League of Nations"
 CLM_the_league_of_nations_desc:0 "It took some substantial work, pleading, careful planning, sleepless nights and many shed tears, but Mercer's magnum opus is complete. A charter for the League of Nations, an organization that will preserve peace and prosperity across Terra, for all Terrans!"
 CLM_democracy_defense_initiative:0 "Democracy Defense Initiative"
 CLM_democracy_defense_initiative_desc:0 "Why stop here? Local clubs, university programs and public meetings between citizen and representative only go so far. We should strive to establish a collective, bottom-up system that allows citizens to directly and effortlessly question their representatives, bring forth ideas and critique and also as a way for them to eventually become representatives themselves. For a democracy without the people is not one!"
 CLM_safeguard_personal_freedom:0 "Safeguard Personal Freedom"
 CLM_safeguard_personal_freedom_desc:0 "Columbia is, first and foremost, a nation of the people for the people. As such, Mercer has proposed some new laws that safeguard the Columbians' right of free speech, public assemblies and demonstrations, and their right of safety from any state violence."
 CLM_the_columbian_pioneers:0 "The Columbian Pioneers"
 CLM_the_columbian_pioneers_desc:0 " "
 CLM_the_league_of_nations_shared:0 "The League of Nations (shared)"
 CLM_the_league_of_nations_shared_desc:0 " "
 CLM_a_secret_election:0 "A Secret Election"
 CLM_a_secret_election_desc:0 "Working in the shadows to keep the darkness at bay. Time to make a decision."
 CLM_unless:0 "...unless"
 CLM_unless_desc:0 " "
 CLM_tools_for_the_job:0 "Tools for the Job"
 CLM_tools_for_the_job_desc:0 "The Bulldog requested additional funds to develop 'The Right Tools for the Job'."
 CLM_somewhere_in_the_mountains:0 "Somewhere in the Mountains..."
 CLM_somewhere_in_the_mountains_desc:0 " "
 CLM_leak_the_experiments:0 "Leak the Experiments"
 CLM_leak_the_experiments_desc:0 "Hensch looks in disbelief as the Professor begins to speak..."
 CLM_walls_like_jericho:0 "Walls like Jericho"
 CLM_walls_like_jericho_desc:0 " "
 CLM_dornr_schen:0 "Dornröschen"
 CLM_dornr_schen_desc:0 "A castle in a magic world, hidden beyond a veil of thorns. Some scientific endeavours are better left outside of the eyes of the public, not because they are wrong but because they are dangerous. While Trimounts is a wonderful place, it is not the prime candidate for our new special research division."
 CLM_best_of_the_best:0 "Best of the Best"
 CLM_best_of_the_best_desc:0 "Welcome the new Columbian Elite! They will follow you to hell and back, Mister Presidente!\n\n§GUnlocks Sonia Bagration as a high command advisor.§!"
 CLM_funnel_in_supplies:0 "Funnel in Supplies"
 CLM_funnel_in_supplies_desc:0 " "
 CLM_they_say_it_cant_be_done:0 "They say it cant be done..."
 CLM_they_say_it_cant_be_done_desc:0 " "
 CLM_specialised_training:0 "Specialised Training"
 CLM_specialised_training_desc:0 "The Bulldog has come up with a training regimen for a new branch of the military."
 CLM_the_human_sacrifices_will_stop:0 "The human sacrifices will stop"
 CLM_the_human_sacrifices_will_stop_desc:0 "No longer will we sit by idly as human lives are turned into means for an end that no one wants."
 CLM_standardized_parts:0 "Standardized Parts"
 CLM_standardized_parts_desc:0 " "
 CLM_where_no_man_has_gone_before:0 "Where no man has gone before"
 CLM_where_no_man_has_gone_before_desc:0 "No place is too far, no environment too hostile for our new elite troops."
