 CLM_a_country_for_you_spirit:0 "A country for you"
 CLM_a_country_for_you_spirit_desc:0 "Come, join, you merry folks! Come gather around so I may tell you about Columbia, a state built for you and me."
 CLM_bloodied_soil:0 "Bloodied Soil"
 CLM_bloodied_soil_desc:0 "During the revolutionary war, our great Columbia, already struggling to keep up with domestic demands due to the heavy taxation and abuse by the vile Victorians, fell completely behind with its agricultural yields. We are reliant on foreign imports and any logistical disruption might cause famine. While Max has the logistical situation currently under control, we should take measures to ensure our agricultural self-sufficiency."
 CLM_bloodied_soil_1:0 "Bloodied Soil"
 CLM_bloodied_soil_1_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_2:0 "Bloodied Soil"
 CLM_bloodied_soil_2_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_3:0 "Bloodied Soil"
 CLM_bloodied_soil_3_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_4:0 "Bloodied Soil"
 CLM_bloodied_soil_4_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_columbian_soil:0 "Columbian Soil"
 CLM_columbian_soil_desc:0 "Though the revolutionary war took a heavy toll on us, Columbia is no longer dependent on agricultural exports by other countries. While much remains to be done, Columbia will not have to fear hunger, at the very least."
 CLM_bloodied_soil_f:0 "Bloodied Soil"
 CLM_bloodied_soil_f_desc:0 "$CLM_bloodied_soil_desc$"
