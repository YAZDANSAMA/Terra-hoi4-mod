 CLM_total_war_desc:0 " "
 CLM_hegemon_of_the_world:0 "Hegemon of the World"
 CLM_hegemon_of_the_world_desc:0 " "
 CLM_friends_in_tara:0 "Friends in Tara"
 CLM_friends_in_tara_desc:0 " "
 CLM_the_forests_of_appalene:0 "The Forests of Appalene"
 CLM_the_forests_of_appalene_desc:0 "While Appalene may not seem as rich in resources as some of our other states, we should strive to properly develop it nonetheless."
 CLM_lumber_settements:0 "Lumber Settements"
 CLM_lumber_settements_desc:0 "There are already many pioneer settlements in the forests of Appalene. It only makes sense that we encourage more workers and their families to move there.\n\n§GUnlocks the state of Appalene on the electoral map.§!"
 CLM_the_bolivar_issue:0 "The Bolivar Issue..."
 CLM_the_bolivar_issue_desc:0 " "
 CLM_nero_is_here:0 "Nero is here"
 CLM_nero_is_here_desc:0 "Welcome, welcome, Hounds of Nero. There may hardly be anyone here, but you are all that matter. Get your guns ready. We are going on an expedition!\n\n§GUnlocks the state of Nero on the electoral map.§!"
 CLM_the_gateway_to_bolivar:0 "The Gateway to Bolivar"
 CLM_the_gateway_to_bolivar_desc:0 "Our friends in Bolivar would surely love more frequent visits from us.\nThey don't?\nToo bad..."
 CLM_the_interstate_railway:0 "The Interstate Railway"
 CLM_the_interstate_railway_desc:0 "Military Command has announced their wish to expand the two main supply routes between Columbia and Bolivar.\nWhy?\nYou should know better than to ask that, Mr. Vice President!"
 CLM_military_industry:0 "Military industry"
 CLM_military_industry_desc:0 "A massive influx of military personnel, agents, officers, common soldiers and the maintainers of the industry have been pooling to Nero en masse, sponsored by the Office of Military Commissions."

 CLM_a_country_for_you_spirit:0 "A country for you"
 CLM_a_country_for_you_spirit_desc:0 "Come, join, you merry folks! Come gather around so I may tell you about Columbia, a state built for you and me."
 CLM_bloodied_soil:0 "Bloodied Soil"
 CLM_bloodied_soil_desc:0 "During the revolutionary war, our great Columbia, already struggling to keep up with domestic demands due to the heavy taxation and abuse by the vile Victorians, fell completely behind with its agricultural yields. We are reliant on foreign imports and any logistical disruption might cause famine. While Max has the logistical situation currently under control, we should take measures to ensure our agricultural self-sufficiency."
 CLM_bloodied_soil_1:0 "Bloodied Soil"
 CLM_bloodied_soil_1_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_2:0 "Bloodied Soil"
 CLM_bloodied_soil_2_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_3:0 "Bloodied Soil"
 CLM_bloodied_soil_3_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_bloodied_soil_4:0 "Bloodied Soil"
 CLM_bloodied_soil_4_desc:0 "$CLM_bloodied_soil_desc$"
 CLM_columbian_soil:0 "Columbian Soil"
 CLM_columbian_soil_desc:0 "Though the revolutionary war took a heavy toll on us, Columbia is no longer dependent on agricultural exports by other countries. While much remains to be done, Columbia will not have to fear hunger, at the very least."
 CLM_bloodied_soil_f:0 "Bloodied Soil"
 CLM_bloodied_soil_f_desc:0 "$CLM_bloodied_soil_desc$"
