 CLM_columbian_soil_f:0 "Columbian Soil"
 CLM_columbian_soil_f_desc:0 "$CLM_columbian_soil_desc$"
 CLM_sweat_and_mud:0 "Sweat and Mud"
 CLM_sweat_and_mud_desc:0 "Columbia is a land of many willing workers but a lack of anything worthwhile to work on. Rough terrain and living conditions, a severe lack of infrastructure, no major urban centers, a lack of tools, expertise, schools, capital...\n\nDependent on imports, foreign products and ideas, with our students going to foreign universities and schools and sometimes relying on the goodwill of our neighbours in Gaul, we are a pathetic nation in a precarious situation, should something befall Gaul...\n\nWe must beget an industrial program of proportions Terra has never before seen. Columbia will not succumb to the eternal stagnation of its foolish neighbours. Through sweat and brains, not blood, we will turn Columbia into the center of the world, under the wise guidance of Mark Max."
 CLM_defanged_eagle:0 "The Defanged Eagle"
 CLM_defanged_eagle_desc:0 "In the revolutionary war, our military, if you can even call it that, has proven again and again that it is too weak to resist outsiders, as horrible as that may be to acknowledge. Without Mark Max we surely would have lost. With him, we will build a new military, a better one. The good thing about our lack of institutions and traditions is that we have free rein in choosing them."
 CLM_columbian_middleman_00000:0 "The Columbian Middleman"
 CLM_columbian_middleman_00000_desc:0 "The Columbian state is neither a knower of truth nor a denier of lies. Neither a creator nor a destroyer. The Columbian Middleman, a term coined by soldiers during the revolutionary war and originally referring to Mark Max and his tendency to encourage factions to work together, describes the Columbian government's tendency to establish rules and frameworks for the economy without forcing it in any direction. It may call for meetings between companies, perform surveys and collect data for all competitors to use, and support research projects all over the board, as long as the results are shared. It may advise against decisions it regards as poor but not stand in their way. All of this while protecting a pre-established framework made to ensure continued operations of the economy. All of this can only work through the thorough calculations of the middleman, Mark Max, himself."
