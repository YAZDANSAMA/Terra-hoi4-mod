 CLM_everyman_science:0 "Everyman Science"
 CLM_everyman_science_desc:0 "Science is no longer the privilege of the few. Every Columbian with a question may expect an answer, and every Columbian with an answer may expect to be asked."
 CLM_embassy_request_tt:0 "Sends a request for an embassy to every country except the Seaborn and uncolonised territories. Columbia gains §G10 political power§! and a permanent §G+30 opinion§! in both directions for every country that accepts."
 CLM_setting_aside_funds:0 "Setting aside Funds"
 CLM_setting_aside_funds_desc:0 "Columbia has diverted considerable parts of its funds for a special project. Growth is stagnating... for now."

 CLM_focus.1.t:0 "The long Road Ahead"
 CLM_focus.1.d:0 "Columbia has struggled much during its war for independence. The same vast steppes, jungles and deserts that helped us win now stand before us as obstacles. We must work to not only overcome them but also bring them into the fold."
 CLM_focus.1.a:0 "Hail, Columbia!"
 CLM_focus.2.t:0 "A country for you!"
 CLM_focus.2.d:0 "While most of Terra bickers among itself and is led by ruthless autocrats, Columbia emphasises freedom, liberty and a right for all to climb up in the world."
 CLM_focus.2.a:0 "A world made for me"
 CLM_focus.3.t:0 "A country for me..."
 CLM_focus.3.d:0 "A wish to profit is no inherent evil. As long as everyone knows what is best for them, egocentric thought will end up bettering the lives of everyone."
 CLM_focus.3.a:0 "Rags to riches?"
 CLM_focus.4.t:0 "Discuss Expansion Projects"
 CLM_focus.4.d:0 "There are several possible expansion paths for Columbia. The vast jungles of the south may hold untold natural riches. The harsh desert of the north gives way to the oceans of Terra. The marshes of Massara can be drained and used for agriculture. The mountains of Oreon lie ready, waiting to be excavated."
 CLM_focus.4.a:0 "Let us choose wisely."
 CLM_focus.5.t:0 "Defying Gravity"
 CLM_focus.5.d:0 "She was staring down, down from where she was. A place she was never supposed to have been. Why was she here? She couldn't help but let out a sigh.\n\nWhy did it have to be her? Her of all people! A gentle breeze ran through her long, brown hair, neatly tied back so it wouldn't get in her way. The two large goggles the engineers had finally given her sat heavy on her face. It had taken an embarrassing amount of begging to convince them that maybe, just maybe, someone expected to spend hours flying through the air might need something to keep the pesky flies out of their eyes.\n\nPesky flies.\n\nAnd not just the ones buzzing around her.\n\nThere was the other kind too, the one in their suits, buzzing around her. Telling her where to go, what to do, every step of the way. Always so important, always certain of what they wanted and that it was more important than what she wanted.\n\nIf only it had been her sister. Oh yes. Her sister would've loved this. She was the adventurous one, always had been. More competent too. But not her. She only yearned to touch the ground again.\n\nShe wanted to rest on the ground so badly. She glanced down. Yep, a fall from this height would be the end of her. She forced herself to look away and snapped out of it:\n\n\"Square AX-47. Small creek, jungle,\" she paused. \"Jungle as far as the eye can see.\"\n\nAnother sigh, as her thoughts wandered to her home once more."
 CLM_focus.5.a:0 "\"Straight on Till Morning\""
 CLM_focus.6.t:0 "In the Hall of the Mountain King"
 CLM_focus.6.d:0 "Placeholder text for this event."
 CLM_focus.6.a:0 "Onwards!"
 CLM_focus.7.t:0 "Oh, say! Can you see..."
 CLM_focus.7.d:0 "The Columbian Revolutionary War against Victoria was a decade ago, yet the scars still remain. Without the help of Gaul and our president Mark Max, we surely would have been put in chains once again. We declared our independence in 1019. True independence, however, is not a right but a privilege. We must work to keep our privilege lest our green-eyed neighbours fall upon us like vultures."
 CLM_focus.7.a:0 "...by the dawn's early light."
 CLM_focus.8.t:0 "The current situation"
 CLM_focus.8.d:0 "Columbia is in a... weird situation. The revolutionary war has left us weak and susceptible to outside interference. Most of our lands are untamed wilderness, our industry is in its infancy, and our military is quasi-nonexistent. While we have possibly some of the brightest minds in the world, they are severely underfunded and lacking any and all scientific instruments. While Mark Max is probably the best president one could wish for, he is also seemingly the only president we will have for the foreseeable future... and possibly forever...\n\nOur neighbours are, by sheer luck if nothing else, too weak to pose a threat to us right now, but situations on the global stage may change that, especially with the ongoing tensions between Gaul and Victoria. Constant danger of famine, financial collapse, invasion...\n\nGood luck, Mister President."
 CLM_focus.8.a:0 "Hail, Columbia!"
 CLM_focus.9.t:0 "Dinner for One"
 CLM_focus.9.d:0 "Placeholder text for this event."
 CLM_focus.9.a:0 "Cheers."
 CLM_focus.10.t:0 "Welcoming the Hounds of Bolivar"
 CLM_focus.10.d:0 "Placeholder text for this event."
 CLM_focus.10.a:0 "Who let the madmen out?"
 CLM_focus.11.t:0 "No place to hide"
 CLM_focus.11.d:0 "The crime scene was akin to a fortress.\n\nThree layers of walls, covered by a dozen watchtowers and enough armed men to occupy a small town. The compound had been built to withstand a siege and its owner had, visibly, not spared any expense to make certain that no one uninvited could ever step inside. Yet here he was, lying dead in his own blood.\n\nThe police chief rubbed his temples and stared at the body. A bullet, clean through the forehead. No signs of struggle. No alarms raised, no guards missing, no shots heard, no damage on the property, on the doors or windows or fences or walls or... And still, someone had walked in and killed the most wanted man in the entirety of Massara.\n\n\"Has anyone found the killer?\" he asked.\n\nHis subordinate shook his head. \"No one saw a thing, sir. The guards swear that the room was empty when they passed it. Their boss was supposed to be in the basement.\"\n\nThe chief took a deep breath. \"They are lying.\"\n\n\"Possibly, sir.\" \"Possibly? Does it look like the bastard was shot in the basement?\"\n\nThe subordinate hesitated before handing over a small zippy bag. \"What is this?\" \"They found it in the boss' pocket.\" \"Evidence? You displaced evidence? Are you completely...\" \"Forensics told me to give it to you.\"\n\nThe chief inspected the object, a small black coin engraved with... \"Son, get me the blank report ready.\"\n\nThe subordinate looked at him with surprise in his eyes. \"Did you find a clue, sir?\" \"I solved the damn bloody case, son.\" \"A-and...\" \"Not our business. We'll let the higher-ups decide what to do about this.\""
 CLM_focus.11.a:0 "At least we won't have to mount an assault anymore."
 CLM_focus.12.t:0 "The Bane of Criminals"
 CLM_focus.12.d:0 "His pleas had done little to dissuade the two men from emptying his purse. \"Damn the purse!\"\n\nHis thoughts were fixed on one question: would he ever get to see his son again?\n\nOne man held him against the damp brickwork while the other took a closer look at the stolen coins in the purse. \"Come on, old man. Is this all you've got? You're hiding something, aren't ya?\"\n\nHe watched in shock as the bandit pressed a knife to his throat. \"Listen up! Either ya tell us where ya got the good stuff, or...\"\n\nA sharp crack rang out through the night, cutting him off mid-sentence. At the far end of the alley stood a newcomer, dressed in a dark travelling coat with its collar raised high against the evening chill. An expressionless face, an ordinary build. There was nothing remarkable about him. You couldn't imagine anyone more unremarkable.\n\nThe bandit holding the knife ordered the stranger to come closer. The stranger didn't move. \"Listen, ya punk! If ya think ye can play games with...\"\n\nHis words were cut short by a scream, which quickly dissolved into the gurgling of blood. The stranger had dashed forward and slit his throat before the eye could follow his movements. The other bandit took a step back in shock as his comrade fell face-first onto the pavement.\n\n\"P-please,\" he stammered. \"We didn't know this was your territory!\" The stranger looked at him. \"It isn't.\"\n\nA brief struggle ensued as the bandit desperately tried to gain the upper hand. Soon, however, his resistance gave way to desperate pleading. A moment later, silence returned to the alleyway.\n\nThe stranger straightened his coat, brushed away a fleck of blood, and retrieved the purse from the ground. He placed it back in the terrified merchant's hands, along with the few coins that had spilled out. \"Your property,\" he said. The merchant didn't dare reply.\n\n\"Robbery, extortion... attempted murder,\" the stranger remarked calmly. \"I'll handle it from here. Please stick to the main roads, good sir.\"\n\nThe merchant watched as the stranger hoisted both bodies onto his back and vanished into the night, his dark coat fluttering in the wind."
 CLM_focus.12.a:0 "A shadow, stalking in the night."
 CLM_focus.13.t:0 "A dance at midnight"
 CLM_focus.13.d:0 "There are two potential candidates for the position of minister of the interior.\n\nOn one hand there is Professor Fergusson, your friendly old man living next door. He is a professor for particle physics at the Trimounts Institute of Technology and, crucially, served as a close comrade under Maylander himself during the Revolutionary War. Fergusson believes in indirect means and a war of information to ensure the continued safety of the Columbian State. He emphasises that the Maylander Foundation must always serve to protect law, not rise above it.\n\nThen there is Enrique Dubois. Half Bolivarian, half Gaul, he witnessed his father being killed in the crossfire of a government raid in Bolivar. He later joined the military, was promoted due to his merit, questioned for his tendency to punish recruits severely and finally given the death penalty when he overstepped his boundaries against the son of a local governor. His personal brigade, the Hounds of Bolivar, helped him escape from prison and were consequently forced to seek refuge in Columbia.\n\nDubois believes that the best way to silence opposition is to 'crack their bones', as he words it. While we may have no interest in silencing any opposition, it is undeniable that his Hounds hit way above their weight and have a perfect record, at least when disregarding collateral.\n\nIt is time for us to choose wisely."
 CLM_focus.13.a:0 "The winner is... Fergusson"
 CLM_focus.13.b:0 "The winner is... Dubois"
 CLM_focus.14.t:0 "There's a bloody dwarf in my mine!"
 CLM_focus.14.d:0 "I thought that I had hit a pocket of unusually soft rock. Turns out, I'd hit a pocket of unusually short people.\nThe lil' guy introduced himself as Bors Ironhide, complained that I was digging in HIS hole, challenged me to a drinking duel and invited me to \"come and see what's down below.\" Naturally, I followed the lil' lad.\nTwo hours through the dark, I am telling you I was sure that I had been led into a trap as I saw the light at the end of the tunnel, yet nay, I found myself standing in the middle of an underground city, I am tellin' ya! A real city! Streets, houses, shops, taverns. The whole damn thing just sat there, buried beneath our feet. There must've been thousands and thousands of Durin, and they all drank and we fought.\nThey just went about their business, unbothered by the fact that an ol' Columbian just walked in from the surface.\n\nAsked my guide how long they'd been living there for.\n\"I dunno,\" he said, shrugging. He dunno!\nThen the lad handed me a shovel and told me to dig.\n\"Dig fer what?\" I asked.\n\n\"And what did they tell you?\"\n\n\"Relics for some bloke called Duq-duck... Duckramam or somethin.\"\n\n\"Relics?\"\n\n\"Yeah, we are gonna need a bigger geological survey. Whatever these blokes are lookin for, they sure found a lot of deposits down 'ere!\""
 CLM_focus.14.a:0 "I'll jar these mountains till they fall."
 CLM_focus.15.t:0 "The Raid commenced (1/2)"
 CLM_focus.15.d:0 "Maylander Report: Classified\nRegarding the illegal human experimentation and illegal development of weapons\nStatus: Threat eliminated. Evidence secured.\nThe assault team entered the research facility in Mount Harran at 15:17, following confirmation of prohibited human experimentation.\nThe lower laboratory was secured by 15:26. Fourteen researchers detained. Two armed security personnel were killed during resistance. One researcher was shot while fleeing and hospitalised. No Directorate casualties.\nBy 15:31 Captain Falls and his squad entered a hidden wing of the complex. There, evidence of systematic experimentation on minors was discovered.\nSecured documentation establishes that at least 27 children had been acquired through falsified medical transfers, orphanages, and the abduction of minors from rural Massaran communities. Their identities had subsequently been erased from civil registries in a cover-up operation that is still being investigated and traced back.\nThe subjects were designated by numerical identifiers. Names were prohibited. Personal possessions were confiscated. The children were subjected to repeated surgical procedures, pharmacological conditioning, and forced exposure to Originum. Restraints and punishment were employed to ensure compliance. Researchers documented injuries, psychological deterioration, and fatalities as operational losses. No attempts at education, rehabilitation, or release were identified.\nFollowing standard interrogation and testimonies, the programme's stated objective was declared to be the production of controllable human weapons for deployment against hostile military formations. The definition of hostile differed from individual to individual but included the current Columbian Government and Mark Max in 3 instances.\nAt 15:56 Subjects Six, Seven, Fourteen and Twentytwo were recovered alive. The other bodies were deemed unrecoverable due to their state. The cleanup crew secured any biological material that was assignable. Subjects Fourteen and Twentytwo died during transport from the injuries sustained when dislodging them from their confinement machines. Seven was rushed to a hospital but continued to suffer heart failures on 4 donor hearts back to back until succumbing while in palliative care.\nSubject: Six\nCodename: GLACIER.\nAge: Estimated to be twelve years old.\nObserved capability: Selective destabilisation and fracture of ferrous materials. Subject can induce rapid structural failure in iron-bearing objects, causing metal to split, buckle, or shatter without conventional impact. Effect is strongest through direct contact and diminishes considerably with distance in both accuracy and strength."
 CLM_focus.15.a:0 "Continue..."
 CLM_focus.16.t:0 "The Raid commenced (2/2)"
 CLM_focus.16.d:0 "Medical condition: Severe hypothermia symptoms including frostbite-induced necrosis, chronic peripheral circulatory impairment, and a traumatic cataract on the left eye. An Originum infection has been confirmed.\nThe subject was discovered restrained inside a reinforced chamber. Restraints had been constructed from specialised alloys and embedded into her arms and legs. Medical records indicate that the subject had been denied adequate thermal protection as a conditioning measure, which led to severe frostbite on her right leg.\nGlacier is placed under Maylander care until further notice and a decision has been made on what to do with her.\nSubsequent investigation: The recovered archives identify multiple prominent figures as financial and political sponsors of the programme. Several attempted to tamper with or destroy records or flee Columbia following the raid.\nThe Directorate has authorised the immediate publication of verified evidence, including internal correspondence, procurement records, and testimony from surviving personnel. Names of involved children and details that could compromise Six' security are to be withheld. The public is to be informed of the programme's existence and the involvement of state officials. The identities of the perpetrators will not be concealed behind national security exemptions.\nEnd of operational record. Maylander protects.\nThe agent set the report aside and took a sip of coffee.\nAcross the desk lay the first draft of the following morning's newspaper, delivered by a contact at the printing house less than an hour earlier. The headline occupied nearly half the front page.\nSTATE OFFICIALS LINKED TO SECRET WEAPON PROGRAMME\nBeneath it sat a photograph of the research annex. The agent read the headline once again.\nGood.\nThe government could deny the report. It could dismiss the witnesses, challenge the documents, and condemn the Directorate for its interference. It could spend months attempting to bury the story. But the names were already in the hands of three newspapers, two radio broadcasters, and, if worse came to worst, the Vice President who had been waiting years for something substantial enough to undermine his political rivals.\nHow many such laboratories still lay hidden, somewhere where even the shadow of Maylander could not see?"
 CLM_focus.16.a:0 "We have done the right thing."
 CLM_focus.17.t:0 "Stille Nacht (1/2)"
 CLM_focus.17.d:0 "Captain Falls entered the room. She sat there, at the edge of her bed, staring at the frost spreading across the iron bars behind the window. What cruel irony, Falls thought to himself. \"May I come in?\" he asked. \"It's your facility, Captain.\" He stood in the doorframe. \"That's not quite an answer.\" \"Then yes.\"\nHe pulled up a chair. Between them stood a small table, a cup of untouched tea, and a pair of very large gloves the medical staff had provided. \"How are you feeling... Glacier?\" \"Fine.\" \"That's not a very convincing answer.\" She looked at him. \"Would you prefer a different one?\" \"I'd prefer an honest one.\" Glacier pondered for a moment. \"I'm scared.\" Falls nodded, as though she'd just told him that birds could fly.\n\"That's all right.\" \"It's not! I'm not supposed to be scared!\" \"Who told you that?\" \"The researchers. They said fear makes people hesitate, and hesitation gets people killed.\" \"Fear can do that,\" Falls conceded. She stared at her hands. A thin layer of ice crept across the metal frame of the bed. \"They're going to make me kill people, aren't they?\"\nFalls didn't answer immediately. The director had made it quite clear that he wasn't supposed to make concessions, promises, or tell her anything about their plans for her. \"They said I was made for it. That I could break guns and armour and bring down buildings. Your... your friends had the same look in their eyes as the researchers who... made me.\" Her voice wavered. \"I'm a weapon. I can only kill.\"\n\"Is that so? Then we have a lot in common.\" She looked up at him. \"W-what do you mean?\" \"I mean, I'm a weapon, too. A tool. People tell me to kill, and I do. I can't do any of your tricks, but I manage.\" \"No! You're fighting evil people...\" \"Evil? How do we know who's evil?\" She looked him in the eyes. \"Those researchers were evil. They hurt my friends!\"\n\"And if I hurt your friends, would you hate me, too?\" \"Yes.\" \"Good.\" She looked genuinely surprised by his answer. \"I became a soldier to protect those I love. I don't wish to kill anyone, but sometimes circumstances force me to. It's not as though I can just dissolve someone's weapons or anything like that.\" Glacier lowered her gaze again. \"What if I kill someone by accident?\" \"We'll teach you how not to.\"\n\"What if I kill someone you love?\" Captain Falls looked at her for a long moment. \"Then we'll have to learn how to live with that, too. But you won't have to figure it out alone.\" Her eyes dropped to the floor. \"Everyone says things like that before they leave.\" He felt that one more keenly than he cared to admit. \"Fair enough,\" he said. \"Then I won't ask you to believe me.\"\nHe took off his coat and laid it across her shoulders. She stiffened at first, but the warmth of the lining soon drew her hands from her sleeves. \"It's too big,\" she murmured. \"Military issue. Everything's too big.\" \"It's warm.\" \"That's generally the idea.\" She gathered the coat around herself. Frost formed along one of the buttons, and a moment later the metal split with a tiny click. Her face fell."
 CLM_focus.17.a:0 "Continue..."
 CLM_focus.18.t:0 "Stille Nacht (2/2)"
 CLM_focus.18.d:0 "\"I'm sorry.\" Falls examined the broken button. \"It's just a button.\" \"I damaged your coat.\" \"I'll survive without it.\" \"But-\" \"Glacier.\" She fell quiet. \"It's all right.\" For the first time since he'd entered the room, she seemed to believe him. Not entirely, perhaps, but enough to let her shoulders relax. Falls glanced at the untouched tea. \"Is that any good?\" \"It's horrible.\"\n\"Excellent. Just the way I like it.\" He poured himself a cup anyway. The tea was lukewarm and tasted faintly of boiled grass. They drank in silence for a while, the captain in his shirtsleeves and the girl wrapped in a coat that could have accommodated two of her. Eventually, her head began to droop. \"Will you come back tomorrow?\" she asked sleepily. \"If you invite me, young lady.\"\nShe nodded, clutching the coat a little tighter. \"Please do, Captain.\" Falls smiled faintly. \"Now, there's something you ought to know. I'm not your Captain, you see. I'm just your friendly neighbour Will from next door. Get up at five every morning, mow the lawn, that sort of thing. I like to paint, too...\" He trailed off, pretending to ponder the matter. \"Oh! And I love sweets!\"\nHe reached into his pocket and produced a small, wrapped candy he'd picked up at reception on his way in. \"Here. Don't tell anyone. It's a terrible habit.\" Glacier stared at the candy, then back at him. \"Are you sure I'm allowed to have it?\" \"I'd say there is a fifty-fifty chance that the Directorate won't kill me if they find out. So do try to keep it between us, kay?\"\nShe carefully took the candy from his hand. For a moment, she simply held it, turning it over in her fingers as though it were something precious. Then she smiled. It was a small, hesitant smile, gone almost as soon as it had appeared. But Falls had seen it, and that was enough. \"There we are,\" he said, settling back into his chair. \"That's much better.\" \"Thank you, Will.\" \"Anytime, neighbour.\"\nFalls stayed until she fell asleep. Outside the room, the medical supervisor informed him that Glacier would require a permanent guardian and that the Directorate was prepared to arrange a suitable placement. Falls looked through the small window in the door. The girl had curled up beneath his coat, one hand resting beside the frozen button. \"Send the paperwork to my quarters,\" he said.\n\"Captain, are you certain? This is a considerable responsibility.\" He watched the frost gather on the window beside her bed. \"Of course not,\" he replied. \"But someone's got to make sure she gets a better answer than the ones she's been given so far.\" He turned to leave, then stopped."
 CLM_focus.18.a:0 "And have someone bring her a proper blanket. Something that doesn't freeze solid!"
 CLM_focus.19.t:0 "Free Siesta!"
 CLM_focus.19.d:0 "Alas, we are here to free Siesta. The question remains on who should become the mayor of the city of Siesta, and thus the de facto leader of the state of Siesta."
 CLM_focus.19.a:0 "Wish the Mayor best of luck in his endeavours!"
 CLM_focus.19.b:0 "Thank the Vice President and President for their support."
