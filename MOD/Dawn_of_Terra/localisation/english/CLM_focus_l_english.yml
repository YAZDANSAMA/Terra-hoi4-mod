 CLM_the_gentlemen_once_again:0 "The Gentlemen, once again"
 CLM_the_gentlemen_once_again_desc:0 "The center has won a large majority. The time has come for coalition building."
 CLM_a_science_for_the_people:0 "A Science for the people"
 CLM_a_science_for_the_people_desc:0 "With the recent purges of these vile beasts calling themselves scientists, we have now set forth a plan to introduce a new generation of researchers into a world of ethical science. No longer will the government tolerate, let alone support, any research endeavour without batting an eye!"
 CLM_free_siesta:0 "Free Siesta"
 CLM_free_siesta_desc:0 "These pioneers and merchantmen are quite unruly. However our President doesn't seem to mind the idea of giving them some breathing room. In fact, he has suggested to allow Siesta to act freely, as both a trading partner and a mercantile ally."
 CLM_establish_a_trading_hq:0 "Establish a Trading HQ"
 CLM_establish_a_trading_hq_desc:0 "These warm waters prove to be a good place for a major port. The lack of catastrophes is also a blessing. Let us invest into this new territory and help the pioneers out!"
 CLM_and_sargon:0 "And Sargon!"
 CLM_and_sargon_desc:0 " "
 CLM_preemptive_expedition_into_the_desert:0 "Preemptive Expedition into the Desert"
 CLM_preemptive_expedition_into_the_desert_desc:0 " "
 CLM_columbia_and_the_world:0 "Columbia and the World"
 CLM_columbia_and_the_world_desc:0 " "
 CLM_a_new_era_of_science:0 "A new Era of Science"
 CLM_a_new_era_of_science_desc:0 " "
 CLM_a_new_era_of_commerce:0 "A new Era of Commerce"
 CLM_a_new_era_of_commerce_desc:0 " "
