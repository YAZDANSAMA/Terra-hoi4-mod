 CLM_DW_D1:0 "Snowshoes, special engine antifreeze, extreme cold-weather suits and special tools to survive in the frozen wastelands of the north. This will allow expeditions into the icy wastelands."
 CLM_DW_D2:0 "We already have tiny microphones that serve us in our daily work, listening to and collecting evidence from the enemies of the state. Making them even smaller will allow us to hide them practically anywhere.\n\n§GCounter intelligence: +0.25§!"
 CLM_DW_D3:0 "Following the hidden microphones, we have come up with a concept for a tiny camera that can be hidden inside a button. Now we can extract even more information, and even an agent that is killed in action may have evidence we can use to not have their efforts gone in vain.\n\n§GCounter intelligence: +0.25§!"
 CLM_DW_D4:0 "An ingenious proposal has been put forward for a small listening device that doesn't use any electrical parts at all, relying purely on a membrane and a Maylander van stationed somewhere near. With this we can hide our bugs in plain sight of our political opponents.\n\n§GCounter intelligence: +0.25§!"
