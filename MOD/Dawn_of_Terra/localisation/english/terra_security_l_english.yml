l_english:
 terra_security.1.t:0 "A warning from [FROM.GetName]"
 terra_security.1.d:0 "[FROM.GetName] has formally warned our government that the dispute between us may lead to escalation. Their diplomats have announced a minimum sixty-day notice period before their diplomatic war-preparation policy can mature. This is a warning of intent, not a declaration of war or proof that they can win. Their government may still back down if relations improve, a pact or common alliance removes the dispute, or domestic exhaustion makes escalation impractical. Focus events and other native game rules continue to operate independently."
 terra_security.1.a:0 "Acknowledge the warning; keep our options open."
 terra_security.1.b:0 "Spend political capital to reopen a channel."
 terra_security_warning_notice_tt:0 "Their diplomatic escalation policy must complete at least sixty days of notice. A warning is not a war goal, a legal permission to attack, or a guarantee of peace."
 terra_security_warning_channel_tt:0 "Costs 15 political power and modestly improves mutual trust while easing grievances. No pact is imposed; use the Diplomatic Desk for a formal agreement. The warning is reconsidered at their next weekly assessment."
 terra_security.10.t:0 "Defensive coordination with [FROM.GetName]"
 terra_security.10.d:0 "[FROM.GetName] believes that our two governments face the same dangerous regional power. Their assessment combines public aggression or reputation with a hostile border or territorial dispute; ordinary dislike alone does not create this opening. They propose exchanging diplomatic information and treating mutual defense as a practical common interest. We remain free to accept or decline. No faction membership, guarantee, military deployment, war, or peace is imposed by this conversation. Native diplomacy still governs any agreement proposed later."
 terra_security.10.a:0 "Open the defensive channel, without a blank cheque."
 terra_security.10.b:0 "Decline respectfully; keep an independent policy."
 terra_security.10.c:0 "The common danger has changed. Close the exchange."
 terra_security_coordination_tt:0 "Modestly improves bilateral trust and goodwill. No faction or automatic guarantee is created. Existing native diplomatic rules and our own choices remain authoritative."
 terra_security_intel_low_tt:0 "Low confidence: sparse intelligence leaves a wide uncertainty margin. A diplomatic offensive needs an estimated strength ratio above 1.8, alongside its other safeguards."
 terra_security_intel_medium_tt:0 "Working confidence: observer intelligence or legacy decryption improves the estimate, but reserves and coalition responses remain uncertain. The required estimated strength ratio is above 1.5."
 terra_security_intel_high_tt:0 "Better corroborated, still uncertain: substantial observer army intelligence or a legacy decryption advantage narrows the margin. An estimated ratio above 1.35 is required; this does not predict the outcome of a war."
 terra_security_common_threat_tt:0 "Both countries currently assess the same dangerous regional power. Cooperation preferences end when that shared danger or the diplomatic relationship no longer qualifies."
