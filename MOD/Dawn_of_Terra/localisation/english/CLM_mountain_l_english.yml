l_english:
 CLM_mountain.1.t:0 "In the Hall of the Mountain King"
 CLM_mountain.1.d:0 "The gold vein seemed to stretch endlessly into the depths. Moving their helmet mounted lamps revealed an endless sea of glitter.\nThen the first strike by the pickaxe.\nAn enormous tremor ripped through the mine as everything began to shake, throwing the miners off balance.\nBefore long, Bors Ironhide had caught up to them.\n\"What have you done?\" he asked.\n\"What have we done?\"\n\"This is the Mountain King's Gold!\"\n\"Mountain King?\"\n\"The Gold we have to give him to appease hi- oh, no.\""
 CLM_mountain.1.a:0 "He's here..."
 CLM_mountain.2.t:0 "Troll, vær deg selv-nok!"
 CLM_mountain.2.d:0 "We have done it! The Mountain King was beaten back, and his treasures are mine. All mine! My treasures, they are mine!"
 CLM_mountain.2.a:0 "Mine, mine, mine!"
 CLM_mountain.3.t:0 "Gå utenom, Peer!"
 CLM_mountain.3.d:0 "A rumble in the dark,\nA tremor in the night.\nBehold, oh Durin of old,\nBehold of the Mountain's might.\nA promise upheld,\nA future in sight.\nA promise broken,\nSends you into a thousand years of blight!"
 CLM_mountain.3.a:0 "Damn you, Columbians!"
 CLM_mountain_missions_category:0 "Mountain King"
 CLM_mountain_king_mission:0 "The Mountain King"
 CLM_mountain_king_mission_desc:0 "Something ancient has been stirred up in these deep and dark depths. We must beat it back, lest the Durin are doomed... and our Gold too! Fortunately, Ironhide has an idea taken from ancient legend..."
