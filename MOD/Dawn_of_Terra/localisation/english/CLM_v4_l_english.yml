 CLM_great_experiment_adjust:0 "The Great Experiment: Policies"
 CLM_great_experiment_adjust_desc:0 "The coalition has left its mark on the Great Experiment. Every concession, every compromise and every gamble changes the mood of the country a little."
 CLM_embassy_established:0 "Columbian embassy established"
 CLM_electoral_map_locked_tt:0 "§RThe Electoral Map is locked.§!"
 CLM_ge_tt_killing:0 "The Great Experiment: §GWar support +10%§!"
 VICTORY_POINTS_4250:0 "Port Hamilton"
 CLM_coalition.1.t:0 "Coalition goals achieved"
 CLM_coalition.1.d:0 "We have achieved our coalition goals for now.\n\nThe promises made to one of the gentlemen have been kept. The others have been waiting, patiently and with growing interest, for their turn. This allows us to work on the points made by the other coalition members and their agendas, provided the populace supports it!\n\nWhose agenda shall we turn to next, Mr. Vice President?"
 CLM_coalition.1.d_done:0 "We have achieved all of our coalition goals.\n\nGrants has his military research, Bonnet has his army reforms and Mercer has his League of Nations. Every promise made across the table of the three gentlemen has been kept, one after the other, without a single partner of the coalition being betrayed or forgotten. Rarely has anyone been so competent and so trustworthy at the same time.\n\nThe newspapers are running out of headlines, the opposition is running out of accusations, and even Mark Max has been seen nodding approvingly at a spreadsheet.\n\nWell done, Mr. Vice President. Columbia thanks you."
 CLM_coalition.1.a:0 "Grants and the National Party may present their military agenda."
 CLM_coalition.1.b:0 "Bonnet and the Federal Democrats may present their plans for the state."
 CLM_coalition.1.c:0 "Mercer and the Liberal Alliance may present their vision for the world."
 CLM_coalition.1.d_opt:0 "A promise kept, to all of them."
 CLM_embassy.1.t:0 "A request for an Embassy"
 CLM_embassy.1.d:0 "President Mark Max sends his regards as the Columbians wish to establish an embassy and thus formal relations between our countries. Should we accept, it would surely lead to further benefits for both of our countries."
 CLM_embassy.1.a:0 "Cheers, to our new Columbian friends!"
 CLM_embassy.1.b:0 "Columbians? I hate 'em!"
 CLM_embassy.2.t:0 "A Kite ain't no horse"
 CLM_embassy.2.d:0 "An envoy from Columbia has arrived, coming with a pleasant offer in hand. They offer to invest into one of our border areas and they only want some of our engineers for a period of two years. While engineers don't grow on trees, surely this would only result in more investments further down the line, right?"
 CLM_embassy.2.a:0 "\"And they were so enchanted with the sound, that they tried to imitate it\""
 CLM_assassination.1.t:0 "A Killing in D.C."
 CLM_assassination.1.d:0 "The lecture was well underway when commotion could be heard outside. The doors burst open and several armed men stormed the hall, sending the audience frantically scrambling for cover. They took aim, just as the speaker, caught just outside his podium's cover, reached for the handgun in his jacket.\n\nFor a moment the entire world stood still.\n\nThen a gunshot rang out.\n\nBy the following morning, the newspapers had already chosen the headlines.\n\nBONNET OF THE FEDERAL DEMOCRATS SHOT DEAD\n\nMERCER OF THE LIBERAL ALLIANCE FOUND STABBED\n\nGRANTS OF THE NATIONAL PARTY ASSASSINATED"
 CLM_assassination.1.a:0 "Oh the humanity!"
