l_english:
 LOADING_TIP_0: "You will realize that they all love themselves more than their neighbors. You will come to know that your proud struggle symbolizes nothing at all. You will come to see. These great lands you threw yourself to do not want you.\n- Kaschey"
 LOADING_TIP_1: "Justice is a luxury for those who have never known hunger. For the rest of us, there is only struggle.\n- Patriot"
 LOADING_TIP_2: "I will not let this world become a graveyard for our dreams.\n- Amiya"
 LOADING_TIP_3: "I am the flame that will burn away the old world. If I must be a monster to save my people, then so be it.\n- Talulah"
 LOADING_TIP_4: "The past is a heavy burden, but it is also the only thing that tells us who we are.\n- Specter the Unchained"
 LOADING_TIP_5: "Victoriy is just a temporary reprieve from the inevitable. But for that reprieve, I will give everything.\n- Nearl the Radiant Knight"
 LOADING_TIP_6: "The only difference between a savior and a destroyer is who is left to tell the story.\n- Theresa"
 LOADING_TIP_7: "The sky is a lie, but the stars are real. We just have to reach high enough to touch them.\n- Director Kristen Wright"
 LOADING_TIP_8: "The world is not fair but it is consistent. If you want to change it, you must first survive it.\n- Dr. Kal'tsit"
 LOADING_TIP_9: "Does death care that I am a child? Would war or disease spare someone because they are a child?\n- Rosmontis"
 LOADING_TIP_10: "BOOM!\n- W"
 LOADING_TIP_11: "QUOTE\n- NAME"
