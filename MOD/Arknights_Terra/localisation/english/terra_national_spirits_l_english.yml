l_english:
 VCT_victorian_industrial_engine:0 "Victorian Industrial Engine"
 VCT_victorian_industrial_engine_desc:0 "Victoria stands among Terra's foremost industrial powers. Dense networks of factories, workshops and mobile-city infrastructure give the empire the means to equip vast armies and sustain ambitious projects."
 VCT_imperial_overextension:0 "Imperial Overextension"
 VCT_imperial_overextension_desc:0 "Victoria's reach stretches far beyond the heartland. Maintaining distant interests, powerful nobles and an enormous military establishment places constant strain upon the imperial administration and its logistics."
 VCT_steam_knight_tradition:0 "Legacy of the Steam Knights"
 VCT_steam_knight_tradition_desc:0 "Victoria's martial prestige is inseparable from its armored champions and the engineering tradition that sustains them. Even where the great machines themselves are scarce, their doctrine continues to shape the army."

 URS_imperial_army:0 "The Ursine Imperial Army"
 URS_imperial_army_desc:0 "Ursus maintains a hardened land army accustomed to brutal climates, long marches and uncompromising battlefield discipline. Few powers can ignore the weight of an Ursine mobilization."
 URS_vast_empire:0 "A Vast Empire"
 URS_vast_empire_desc:0 "Ursus commands immense territory, population and natural wealth. Its scale offers great reserves, but moving supplies and governing the vast realm places a constant burden on the imperial state."
 URS_empire_igor_built:0 "The Empire Igor Built"
 URS_empire_igor_built_desc:0 "The state forged by Igor the Great remains the foundation of modern Ursus. The throne draws legitimacy from his victories, the institutions created in his wake, and the belief that imperial strength is the natural order of the realm."
 URS_service_earns_nobility:0 "Service Earns Nobility"
 URS_service_earns_nobility_desc:0 "In Ursus, military service has long been a road to status and privilege. Officers who prove themselves in campaign can rise far beyond the station of their birth, binding ambition and social advancement to the fortunes of the Imperial Army."
 URS_marshals_armies:0 "The Marshals' Armies"
 URS_marshals_armies_desc:0 "The armies of Ursus are powerful, experienced, and deeply shaped by the marshals who command them. Their independence gives the empire formidable operational strength, but it also leaves the court dependent on men whose loyalties do not always begin and end with the throne."
 URS_blocked_from_heartland:0 "Blocked from the Heartland"
 URS_blocked_from_heartland_desc:0 "Gaul's position across the routes into central Terra constrains Ursine trade and access to the wealthier southern heartlands. The empire possesses vast resources of its own, yet distance and obstruction continue to weigh on industry and commerce."
 URS_southern_ambitions:0 "Southern Ambitions"
 URS_southern_ambitions_desc:0 "By 1030, the crisis to the south has become impossible for the Ursine court to ignore. Military planners now look beyond the frontier, preparing the empire for intervention and expansion."

 LTH_witch_kings_reign:0 "Reign of the Witch King"
 LTH_witch_kings_reign_desc:0 "The Witch King's mastery of Arts makes Leithanien terrifying in war, yet fear and coercion permeate the realm. His personal power strengthens the state even as it corrodes its foundations."
 LTH_land_of_arts:0 "Land of Arts"
 LTH_land_of_arts_desc:0 "Leithanien's institutions, musicians and scholars have cultivated an extraordinary tradition of Arts. Military and academic circles alike draw strength from generations of specialized study."
 LTH_kurfursten_tensions:0 "Kurfürsten Tensions"
 LTH_kurfursten_tensions_desc:0 "The Kurfürsten remain powerful centers of authority beneath the Witch King's shadow. Rival interests, fear of the throne and disputes over the future of Leithanien undermine unity at the highest level."

 TRR_taran_liberation_movement:0 "Taran Liberation Movement"
 TRR_taran_liberation_movement_desc:0 "Taran fighters see the struggle as more than a conventional war. It is a campaign to recover their homeland, culture and political future, giving the movement unusual resilience and determination."
 TRR_impoverished_homeland:0 "Impoverished Homeland"
 TRR_impoverished_homeland_desc:0 "Years of neglect and exploitation have left Tara with weak industry and fragile infrastructure. Every campaign must contend with shortages that wealthier Terran powers can more easily absorb."
 TRR_reclaimed_identity:0 "Reclaimed Identity"
 TRR_reclaimed_identity_desc:0 "Revived language, symbols and historical memory bind the Taran cause together. Reclaiming a suppressed identity has become a source of political cohesion as well as military resolve."
