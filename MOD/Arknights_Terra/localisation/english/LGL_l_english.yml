 LGL_economic_spirit: "Gaul's Glitz and Glamour"
 LGL_economic_spirit_desc: "The lights of our cities and the smog of our factories serve to speak of beauty and prosperity. Yet, behind the glitz and the glamour of our nation, our people chase opulence and pleasure while our factories and assembly lines toil with outdated technology and undesirable inefficiency. If we want to continue spreading our hegemony and ensure our legacy persists beyond time, we must ensure that we don't fall to the vices of obstinacy and neglect."

 LGL_notre_langue: "The \"Notre Langue\""
 LGL_notre_langue_desc: "The Gallic language has evolved to become the world's lingua franca, but only in name. With the release of the modern Gallic language textbook, we have finally made our linguistic influence over Terra a reality, becoming a staple in classrooms and libraries all over the continent."

 LGL_livre_standard: "The Livre Standard"
 LGL_livre_standard_desc: "Our currency, the livre, has become the standard across all of Terra, used in transactions and trade internationally and becoming the de facto standard of some nations."

