 LGL_gallic_hegemony: "Waning Gallic Hegemony"
 LGL_gallic_hegemony_desc: "Gaul enters the 11th century with unprecedented global influence, won through the rapid growth and expansion of the past few centuries. Yet this dominance has bred decadence within its noble courts and bureaucracy, and Gaul has fallen into stagnation as its neighboring powers continue to eye the fading empire. As Corsica I rose to the throne to lead forth a new Gallic Era, he seeks to remedy these ills by any means possible.\n\n§REven if it means the nation must shed its own blood once more.§!"

 LGL_victorian_reparations: "Victorian Reparations"
 LGL_victorian_reparations_desc: "Emerging as the victtor in the brutal Gallo-Victorian War, Gaul's victory in the Gallo-Victorian War was costly, but the peace it dictated was harsher still. The reparations imposed upon the young Victorian nation have not broken it, yet they have bred a lasting bitterness toward Gaul and its habit of meddling in Victorian affairs.\n\n§RA humbled enemy is not a harmless one, much less a wounded lion whose dignity we have struck time and again. We must keep watch on those Aslan upstarts to the south, lest either strike back when our guard is down.§!"
