 LGL_urs_nonagg_friend_desc: "gaul holds party w/ ursus and concedes territories+factories to guarantee nonaggression pact\n\nevent:\n++consumer goods\n--potential to territories\nnonaggression (ursus) (1+ yr)"
 LGL_urs_nonagg_aggro: "Distract the Bear"
 LGL_urs_nonagg_aggro_desc: "gaul incentivizes tribal riots and Kazimierzian separatists to cause havoc in ursus\n\nursus:\n+spirit that disallows wars for years depending on luck and reduces factory output and manpower\n-stab\n\ngaul:\n-ursus opinion\n+kazimierz opinion\n--equipment\n++consumer goods"
