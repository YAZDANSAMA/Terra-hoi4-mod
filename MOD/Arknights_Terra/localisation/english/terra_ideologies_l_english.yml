 classical_liberalism_subtype: "Classical Liberal"
 technocracy_subtype: "Technocratic"
 monarchism_subtype: "Monarchist"

 revolutionary_subtype_desc: "Governments that have seized power through popular revolution, often seeking to radically transform society and the economy in the name of equality and justice."
 junta_subtype_desc: "Governments led by military officers or generals who have taken control of the state, often prioritizing order and security over democratic processes."
 ethnonationalism_subtype_desc: "Governments organized around the primacy of a single ethnic or cultural identity, often at the expense of minorities within their claimed territory."
 corporatism_subtype_desc: "Governments that exist to serve the interests of organized economic groups, such as businesses. They often, but not always, prioritize the needs of corporations and industry over individual rights or democratic representation."
 theocracy_subtype_desc: "Governments where religious authority and political power are one and the same, ruled by clergy or in the name of divine mandate."
 social_democracy_subtype_desc: "Governments elected through popular mandate that seek to reform capitalism through the ballot box, balancing free enterprise with strong social welfare policies."
 classical_liberalism_subtype_desc: "Governments built on constitutional rule of law, civil liberties, and free enterprise, tracing their roots to Enlightenment political philosophy."
 technocracy_subtype_desc: "Governments run by appointed experts, engineers, and administrators rather than elected politicians, placing efficiency and pragmatism above ideology."
 monarchism_subtype_desc: "Governments centered on hereditary rule, whether a constitutional crown or an absolute imperial throne, drawing legitimacy from dynasty, tradition and blood."

