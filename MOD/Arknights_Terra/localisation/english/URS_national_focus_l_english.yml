l_english:
 URS_the_gaulish_crisis:0 "The Gaulish Crisis"
 URS_the_gaulish_crisis_desc:0 "The balance of power in central Terra is beginning to shift. The Ursine court must watch Gaul's ambitions carefully and consider what opportunities a wider crisis may create."
 URS_eyes_to_the_south:0 "Eyes to the South"
 URS_eyes_to_the_south_desc:0 "Our southern frontier can no longer be treated as a distant concern. Reports, plans and deployments must be reviewed with the possibility of intervention in mind."
 URS_prepare_the_southern_commands:0 "Prepare the Southern Commands"
 URS_prepare_the_southern_commands_desc:0 "Before the empire can act, its commanders must prepare routes, staffs and formations for a campaign beyond the southern frontier."
 URS_embrace_southern_ambitions:0 "Southern Ambitions"
 URS_embrace_southern_ambitions_desc:0 "The moment for passive observation is ending. Ursus will prepare to turn the instability to the south into an opportunity for imperial expansion."
