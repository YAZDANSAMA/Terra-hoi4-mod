 LGL_urs_nonagg_friend_desc:0 "gaul holds party w/ ursus and concedes territories+factories to guarantee nonaggression pact\n\nevent:\n++consumer goods\n--potential to territories\nnonaggression (ursus) (1+ yr)"
 LGL_urs_nonagg_aggro:0 "Distract the Bear"
 LGL_urs_nonagg_aggro_desc:0 "gaul incentivizes tribal riots and Kazimierzian separatists to cause havoc in ursus\n\nursus:\n+spirit that disallows wars for years depending on luck and reduces factory output and manpower\n-stab\n\ngaul:\n-ursus opinion\n+kazimierz opinion\n--equipment\n++consumer goods"
