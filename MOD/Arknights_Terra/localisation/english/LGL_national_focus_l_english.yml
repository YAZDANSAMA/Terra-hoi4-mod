l_english:
 LGL_start:0 "The Belle Époque"
 LGL_start_desc:0 "The past few decades have been kind to Gaul.\n\nLingones was transformed from a backwater town to the Capital of the World in a heartbeat. Art, philosophy, and the sciences dominate Gallic culture, and the Gallic language has become the standard language in all of Terra.\n\nHowever, as corruption begins to run rampant amidst our nobility and bureaucracy, our emperor Corsica I has deemed that the Gallic hegemony is fading. And with our neighbors eyeing the nation like beasts to a prey, he may be right. It truly is time for Gaul to realize its glory days by showcasing its true power to the world.\n\n+stab\n+war sup"
 LGL_mil_start:0 "Assess the Victorian War"
 LGL_mil_start_desc:0 "The Victorian war was a resounding success in nothing but name.\n\nWhile we dominated Victoria in our latest war, it also revealed many devastating shortcomings within the Grande Armée that had led to many unnecessary defeats and losses that could've been easily prevented.\n\nWe need to resolve this quickly before it becomes a major issue in our upcoming wars.\n\n+doctrine boost\n+mil tech boost\n+mil spirit"
 LGL_poli_start:0 "Politique Mondiale"
 LGL_poli_start_desc:0 "The world is against us.\n\nLeithanien is ruled by a mad Witch King who spends all of his time studying Arts. Ursus has been eyeing our bordersas they try to emulate us and create its own empire. And Victoria seeks revenge for our justified involvement in the Columbian Revolutionary War.\n\nIn order to assert our global dominance, we need to take care of these upstarts before they can become a major problem.\n\n+pp\n+stab"
 LGL_eco_start:0 "Appoint New Economic Council"
 LGL_eco_start_desc:0 "Lingones is the Capital of Terra and the eyepiece of our empire.\n\nHowever, we must not neglect everything else outside our capital city. We may flourish in arts, philosophy, and technology, but our industrial might has yet to be realized.\n\nGaul should stand not just as a nation of artisans and scholars, but also as a superpower of industry and technology.\n\n+econ spirit"
 LGL_static_army_1:0 "Complete the Reforms"
 LGL_static_army_1_desc:0 "While the reforms addressed by the Second Economic Reform Act have mostly been implemented, the recent war revealed a few critical details and loopholes we missed during the drafting of the bill, resulting in the unnecessary losses of many of our forces. In order to have a proper Grande Armée, we need to iron out these flaws before they become our downfall.\n\n+doc buff\n\nspirit:\n+org\n-div train time"
 LGL_asymmetric_army_1:0 "Revise the Reforms"
 LGL_asymmetric_army_1_desc:0 "+doc buff\n\nspirit:\n-org loss when moving\n+div speed"
 LGL_miltech_arts_1:0 "Advance Gallic Arts"
 LGL_miltech_arts_1_desc:0 "Our failures in the Victorian war were mostly placed in our lack of Arts firepower against the Victorian machines. We need to remedy this if we were to face Leithanien's music-based Arts."
 LGL_miltech_steam_1:0 "Salvage Victorian Scraps"
 LGL_miltech_steam_1_desc:0 "Victoria's might was laid in their advanced metalwork technology. If we can take that and utilize it for ourselves, perhaps our upcoming foray into Leithanien may prove to be prudent.\n\n+mil tech bonus\n+equipment"
 LGL_vic_start:0 "Shedding the Lion's Mane"
 LGL_vic_start_desc:0 "+pp\n+war support"
 LGL_lei_start:0 "Le Masque Tombé"
 LGL_lei_start_desc:0 "-leithanien opinion\n+pp"
 LGL_urs_start:0 "Taming the Hungry Bear"
 LGL_urs_start_desc:0 "+pp\n+stab"
 LGL_industry_research_1:0 "Notre Langue"
 LGL_industry_research_1_desc:0 "basically a gallic language textbook\n\n+population\n\nspirit:\n+research speed or something\n-consumer goods"
 LGL_industry_mil_1:0 "Fund the Metalworks"
 LGL_industry_mil_1_desc:0 "++mils\n\nspirit:\n+factory output\n+prod efficiency/retention"
 LGL_industry_civ_1:0 "Invest in Luxury Goods"
 LGL_industry_civ_1_desc:0 "++civs\n\nspirit:\n+civ construction speed\n-consumer goods"
 LGL_static_army_2:0 "Enforce Military Discipline"
 LGL_static_army_2_desc:0 "spirit:\n++org\n+defense"
 LGL_shared_army_1:0 "Form the Gallic War Council"
 LGL_shared_army_1_desc:0 "Victoria's military structure relied on a few competent noble officers that effectively gave out orders to entire armies and armadas, giving them the much-needed flexibility and structure to withstand our forces. Perhaps we should emulate this and place some of our best leaders and governors into a war council similar to theirs.\n\n++doc buffs\n\nspirit:\n-org loss when moving\n+max plan\n+plan speed"
 LGL_asymmetric_army_2:0 "Contact the Columbian Veterans"
 LGL_asymmetric_army_2_desc:0 "spirit:\n-org loss\n--attrition\n+supply grace\n+atk"
 LGL_miltech_arts_2:0 "Kazdelian Overtures"
 LGL_miltech_arts_2_desc:0 "The Sarkaz have been well-known for their infamous witchcraft Arts. Now that the devils have settled in what they call their home, perhaps it's time for us to pay them a visit. \n\n+mp\n+special divisions\n-stab\n\nspirit:\n-org\n+atk"
 LGL_miltech_steam_2:0 "Study the Steam Knights"
 LGL_miltech_steam_2_desc:0 "The Steam Knights of Victoria are one of the most advanced pieces of technology in all of Terra, being impervious to both physical and Arts attacks. If we can find a way to reverse-engineer these, then we may have ourselves a trump card against the Leithanien forces.\n\n+special units\n+mil tech bonus\n\nspirit:\n+def\n+factory output"
 LGL_vic_1:0 "Fund the Taran Nationalists"
 LGL_vic_1_desc:0 "+resistance in victoria territories bordering tara\n-victorian stab"
 LGL_lei_1:0 "Contact the Kurfürsten"
