 LGL_vic_nonagg_friend:0 "Repay the Victorians"
 LGL_vic_nonagg_friend_desc:0 "gaul pays reparations to victoria for nonaggression pact\n\n++consumer goods\n-stability\n+guaranteed nonaggression pact w/ victoria (1+ yr)"
