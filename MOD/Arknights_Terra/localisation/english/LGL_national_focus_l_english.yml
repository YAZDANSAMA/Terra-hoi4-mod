 LGL_vic_nonagg_aggro_desc:0 "gaul launches critical infrastructure attacks w/ help from taran nationalists\n\nvictoria:\n+spirit that disallows wars for years depending on luck and reduces factory output and manpower\n-stab\n\ngaul:\n-victoria opinion\n-gaul opinion\n++consumer goods\n--infantry equipment"
