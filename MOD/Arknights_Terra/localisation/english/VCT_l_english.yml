l_english:
 VCT_victorian_industrial_engine: "Victorian Industrial Engine"
 VCT_victorian_industrial_engine_desc: "Victoria stands among Terra's foremost industrial powers. Dense networks of factories, workshops and mobile-city infrastructure give the empire the means to equip vast armies and sustain ambitious projects."
 VCT_imperial_overextension: "Imperial Overextension"
 VCT_imperial_overextension_desc: "Victoria's reach stretches far beyond the heartland. Maintaining distant interests, powerful nobles and an enormous military establishment places constant strain upon the imperial administration and its logistics."
 VCT_steam_knight_tradition: "Legacy of the Steam Knights"
 VCT_steam_knight_tradition_desc: "Victoria's martial prestige is inseparable from its armored champions and the engineering tradition that sustains them. Even where the great machines themselves are scarce, their doctrine continues to shape the army."
 VCT_gallic_reparations: "Gallic Reparations"
 VCT_gallic_reparations_desc: "Emerging as the victtor in the brutal Gallo-Victorian War, Gaul's victory in the Gallo-Victorian War was costly, but the peace it dictated was harsher still. The reparations imposed upon the young Victorian nation have not broken it, yet they have bred a lasting bitterness toward Gaul and its habit of meddling in Victorian affairs.\n\n§RWhen the opportunity comes, we will make sure those Liberi will never humiliate us again.§!"
 VCT_LGL_reps: "Gallic Reparations"